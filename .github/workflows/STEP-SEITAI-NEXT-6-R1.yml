name: STEP SEITAI-NEXT-6-R1

on:
  push:
    branches: [main]
    paths: [".github/workflows/STEP-SEITAI-NEXT-6-R1.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seitai-next-6-r1
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/STEP-SEITAI-NEXT-6-R1.yml
  BACKUP_TAG: backup-seitai-before-next-6-20260723

jobs:
  reception-and-staff-mobile:
    name: Reception iPad and staff smartphone separation R1
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify previous STEP and create rollback tag
        shell: bash
        run: |
          set -euo pipefail
          test -f dpro-next-ledger.yml
          grep -q 'current_step: "SEITAI-NEXT-5-COMPLETE"' dpro-next-ledger.yml
          grep -q 'next_step: "SEITAI-NEXT-6"' dpro-next-ledger.yml
          for file in owner.html owner-ipad.html config.js system-check.html index.html member.html; do test -f "$file"; done
          test ! -f staff.html

          # The first NEXT-6 run already created the rollback tag before it stopped.
          # Reuse that protected NEXT-5 commit instead of treating the failed workflow upload as the baseline.
          if git rev-parse "$BACKUP_TAG" >/dev/null 2>&1; then
            BASELINE_SHA="$(git rev-list -n 1 "$BACKUP_TAG")"
          else
            BASELINE_SHA="$(git log -1 --format=%H -- dpro-next-ledger.yml)"
            test -n "$BASELINE_SHA"
            git tag -a "$BACKUP_TAG" "$BASELINE_SHA" -m "DPRO 整骨院・整体 LINE before SEITAI-NEXT-6"
            git push origin "$BACKUP_TAG"
          fi
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
          test -f .github/workflows/STEP-SEITAI-NEXT-6.yml

          git show "$BASELINE_SHA:owner.html" > /tmp/owner.before.html
          git show "$BASELINE_SHA:owner-ipad.html" > /tmp/owner-ipad.before.html
          git show "$BASELINE_SHA:config.js" > /tmp/config.before.js
          git show "$BASELINE_SHA:system-check.html" > /tmp/system-check.before.html

      - name: Apply reception and staff mobile screens
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: target not found")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, got {count}")
              return updated

          reception_css = r'''
            /* DPRO NEXT-6: reception-first iPad */
            .receptionFocus{border:1px solid #99f6e4;background:linear-gradient(180deg,#ffffff,#f3fffb);scroll-margin-top:18px}
            .receptionFocusGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
            .receptionMetric{border:1px solid #ccfbf1;border-radius:18px;background:#fff;padding:14px;text-align:left;color:inherit}
            .receptionMetric b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.04em}.receptionMetric span{display:block;margin-top:3px;color:#64748b;font-size:11px;font-weight:900}
            .receptionMetric.urgent{border-color:#fecaca;background:#fffafa}.receptionMetric.waiting{border-color:#fde68a;background:#fffdf7}.receptionMetric.treatment{border-color:#99f6e4;background:#f4fffc}
            .receptionQueue{display:grid;gap:9px;margin-top:14px}.receptionRow{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid #e2e8f0;border-radius:17px;background:#fff;padding:12px}
            .receptionRow.urgent{border-color:#fecaca;background:#fffafa}.receptionRow.waiting{border-color:#fde68a;background:#fffdf7}.receptionRow.treatment{border-color:#99f6e4;background:#f4fffc}.receptionTime{font-size:21px;font-weight:950}.receptionName{font-size:16px;font-weight:950}.receptionMeta{margin-top:3px;color:#64748b;font-size:12px;line-height:1.55}
            .receptionOtherToggle{border-style:dashed;background:#f8fafc}.receptionSecondaryCard{display:none}.grid.showReceptionSecondary .receptionSecondaryCard{display:block}
            @media(max-width:700px){.receptionFocusGrid{grid-template-columns:1fr}.receptionRow{grid-template-columns:1fr}.receptionRow .btn{width:100%}}
          '''

          reception_board = r'''
                <div class="card span12 receptionFocus" id="receptionFocusSection">
                  <div class="sectionHead">
                    <div><span class="badge">受付担当が最初に見る場所</span><h2 style="margin-top:10px;">受付優先リスト</h2><p class="note">来院受付が必要な患者を上から確認します。施術開始・完了はスタッフスマホ画面へ分離しました。</p></div>
                    <a class="btn primary" href="./staff.html">スタッフスマホ画面</a>
                  </div>
                  <div class="receptionFocusGrid">
                    <button class="receptionMetric urgent" data-reception-filter="reserved" type="button"><b id="receptionOverdueCount">-</b><span>受付確認・来院待ち</span></button>
                    <button class="receptionMetric waiting" data-reception-filter="arrived" type="button"><b id="receptionWaitingCount">-</b><span>受付済み・施術待ち</span></button>
                    <button class="receptionMetric treatment" data-reception-filter="treatment" type="button"><b id="receptionTreatmentCount">-</b><span>現在施術中</span></button>
                  </div>
                  <div class="receptionQueue" id="receptionQueue" aria-live="polite"></div>
                </div>
          '''

          reception_js = r'''
            /* DPRO NEXT-6: reception-first queue */
            function receptionTimeMinutes(value){const p=String(value||"").slice(0,5).split(":").map(Number);return(p[0]||0)*60+(p[1]||0)}
            function renderReceptionFocus(){
              const today=state.date===todayText(),now=new Date(),nowMinutes=now.getHours()*60+now.getMinutes();
              const reserved=state.reservations.filter((r)=>r.status==="reserved").sort((a,b)=>String(a.start_time||"").localeCompare(String(b.start_time||"")));
              const arrived=state.reservations.filter((r)=>r.status==="arrived").sort((a,b)=>String(a.start_time||"").localeCompare(String(b.start_time||"")));
              const treatment=state.reservations.filter((r)=>r.status==="in_treatment"||r.status==="treatment_done").sort((a,b)=>String(a.start_time||"").localeCompare(String(b.start_time||"")));
              const overdue=reserved.filter((r)=>today&&receptionTimeMinutes(r.start_time)<nowMinutes);
              $("receptionOverdueCount").textContent=reserved.length;$("receptionWaitingCount").textContent=arrived.length;$("receptionTreatmentCount").textContent=treatment.length;
              const ordered=[...overdue,...reserved.filter((r)=>!overdue.includes(r)),...arrived,...treatment].slice(0,12),box=$("receptionQueue");
              if(!ordered.length){box.innerHTML=`<div class="empty">この日の受付優先対応はありません。</div>`;return}
              box.innerHTML=ordered.map((r)=>{const id=String(r.reservation_id||r.id||""),isOver=overdue.includes(r),cls=isOver?"urgent":r.status==="arrived"?"waiting":"treatment",label=isOver?"受付確認":r.status==="reserved"?"来院待ち":r.status==="arrived"?"施術待ち":"施術中",action=r.status==="reserved"?`<button class="btn primary" data-reception-checkin="${escapeHtml(id)}" type="button">来院受付</button>`:`<a class="btn ghost" href="./staff.html">スタッフ画面</a>`;return`<div class="receptionRow ${cls}"><div class="receptionTime">${escapeHtml(formatTime(r.start_time)||"--:--")}</div><div><div class="receptionName">${escapeHtml(r.customer_name||"-")} 様</div><div class="receptionMeta">${escapeHtml(r.menu_name||"-")} / 担当：${escapeHtml(r.staff_name||"未定")} / ${escapeHtml(label)}</div></div>${action}</div>`}).join("");
              box.querySelectorAll("[data-reception-checkin]").forEach((button)=>button.addEventListener("click",()=>handleReservationAction("arrived",button.dataset.receptionCheckin,button)));
            }
          '''

          staff_html = base64.b64decode("").decode("utf-8")
          Path("staff.html").write_text(staff_html, encoding="utf-8")

          ipad_path = Path("owner-ipad.html")
          ipad = ipad_path.read_text(encoding="utf-8")
          ipad = replace_once(ipad, "<!-- STEP SEITAI-NEXT-5: ticket safety and next visit guidance / 20260723 -->", "<!-- STEP SEITAI-NEXT-6: reception-first iPad and staff separation / 20260723 -->", "ipad comment")
          ipad = ipad.replace("｜iPad受付・施術画面｜STEP SEITAI-NEXT-5", "｜iPad受付中心・共用画面｜STEP SEITAI-NEXT-6", 1)
          ipad = ipad.replace("./config.js?v=step-seitai-next-5", "./config.js?v=step-seitai-next-6", 1)
          ipad = ipad.replace("STEP SEITAI-NEXT-5 / owner-ipad.html", "STEP SEITAI-NEXT-6 / owner-ipad.html", 1)
          ipad = ipad.replace("iPad受付・施術画面", "iPad受付中心・共用画面", 1)
          ipad = ipad.replace("受付・施術中に使う画面です。店舗設定は出さず、予約確認・来院・施術・回数券・文面コピーに絞っています。", "受付担当が来院確認を迷わず進めるための画面です。施術開始・完了はスタッフスマホ画面へ役割分離し、従来の共用操作も残します。", 1)
          ipad = ipad.replace('<span class="chip">受付用</span>', '<span class="chip">受付中心</span>', 1)
          ipad = ipad.replace('<span class="chip">施術用</span>', '<span class="chip">スタッフ連携</span>', 1)
          ipad = replace_once(ipad, '<a class="btn ghost" href="./owner.html" style="text-decoration:none;">PC管理画面へ</a>', '<a class="btn ghost" href="./owner.html" style="text-decoration:none;">PC管理画面へ</a>\n          <a class="btn primary" href="./staff.html" style="text-decoration:none;">スタッフスマホ画面</a>', "ipad staff link")
          ipad = replace_once(ipad, "  </style>", reception_css + "\n  </style>", "ipad css")
          ipad = replace_once(ipad, '      <div class="card span12 workflowBoard" id="workflowBoardSection">', reception_board + '\n      <div class="card span12 workflowBoard" id="workflowBoardSection">', "ipad reception board")
          ipad = regex_once(ipad, r'<div class="card span6">\s*<div class="sectionHead">\s*<div>\s*<h2>フォロー対象</h2>', '<div class="card span6 receptionSecondaryCard" id="receptionFollowupCard">\n        <div class="sectionHead">\n          <div>\n            <h2>フォロー対象</h2>', "ipad followup class", re.S)
          ipad = regex_once(ipad, r'<div class="card span6">\s*<div class="sectionHead">\s*<div>\s*<h2>回数券残数注意</h2>', '<div class="card span6 receptionSecondaryCard" id="receptionTicketCard">\n        <div class="sectionHead">\n          <div>\n            <h2>回数券残数注意</h2>', "ipad ticket class", re.S)
          ipad = replace_once(ipad, '      <div class="card span6 receptionSecondaryCard" id="receptionFollowupCard">', '      <div class="card span12 receptionOtherToggle"><div class="sectionHead"><div><h2>その他の業務</h2><p class="note">フォローと回数券注意は必要な時だけ開きます。</p></div><button class="btn ghost" id="receptionOtherToggleBtn" type="button">その他業務を表示</button></div></div>\n\n      <div class="card span6 receptionSecondaryCard" id="receptionFollowupCard">', "ipad secondary toggle")
          ipad = replace_once(ipad, "  function renderAll() {", reception_js + "\n  function renderAll() {", "ipad reception js")
          ipad = replace_once(ipad, "    renderStats();\n    renderWorkflowBoard();", "    renderStats();\n    renderReceptionFocus();\n    renderWorkflowBoard();", "ipad render call")
          ipad = replace_once(ipad, "    initTabs();", '''    $("receptionOtherToggleBtn").addEventListener("click",()=>{const grid=document.querySelector("main .grid"),open=grid.classList.toggle("showReceptionSecondary");$("receptionOtherToggleBtn").textContent=open?"その他業務を閉じる":"その他業務を表示"});
            document.querySelectorAll("[data-reception-filter]").forEach((button)=>button.addEventListener("click",()=>{state.filter=button.dataset.receptionFilter;document.querySelectorAll("[data-filter]").forEach((tab)=>tab.classList.toggle("selected",tab.dataset.filter===state.filter));renderReservations();$("reservationList").scrollIntoView({behavior:"smooth",block:"start"})}));
            initTabs();''', "ipad events")
          ipad_path.write_text(ipad, encoding="utf-8")

          owner_path = Path("owner.html")
          owner = owner_path.read_text(encoding="utf-8")
          owner = replace_once(owner, "<!-- STEP SEITAI-NEXT-5: ticket safety and next visit guidance / 20260723 -->", "<!-- STEP SEITAI-NEXT-6: staff smartphone navigation / 20260723 -->", "owner comment")
          owner = owner.replace("｜オーナー管理｜STEP SEITAI-NEXT-5", "｜オーナー管理｜STEP SEITAI-NEXT-6", 1)
          owner = owner.replace("./config.js?v=step-seitai-next-5", "./config.js?v=step-seitai-next-6", 1)
          owner = owner.replace("STEP SEITAI-NEXT-5 / owner.html", "STEP SEITAI-NEXT-6 / owner.html", 1)
          owner = replace_once(owner, '<a class="btn ghost" href="#reservationSection">予約一覧</a>', '<a class="btn ghost" href="#reservationSection">予約一覧</a>\n          <a class="btn ghost" href="./owner-ipad.html">iPad受付</a>\n          <a class="btn ghost" href="./staff.html">スタッフスマホ</a>', "owner navigation")
          owner_path.write_text(owner, encoding="utf-8")

          system_path = Path("system-check.html")
          system = system_path.read_text(encoding="utf-8")
          system = system.replace("｜System Check｜STEP SEITAI-NEXT-2", "｜System Check｜STEP SEITAI-NEXT-6", 1)
          system = system.replace('<script src="./config.js"></script>', '<script src="./config.js?v=step-seitai-next-6"></script>', 1)
          system = system.replace("STEP SEITAI-NEXT-2 / system-check.html", "STEP SEITAI-NEXT-6 / system-check.html", 1)
          system = system.replace("grid-template-columns:repeat(5,minmax(0,1fr));", "grid-template-columns:repeat(6,minmax(0,1fr));", 1)
          old_steps = '''          <div class="demoStep">
            <b>3. iPad受付</b>
            来院済み・施術中・回数券使用を見せる。
          </div>
          <div class="demoStep">
            <b>4. 会員証</b>
            テスト太郎で予約と回数券を見せる。
          </div>
          <div class="demoStep">
            <b>5. お客様予約</b>
            新規予約・担当指名・空き時間を見せる。
          </div>'''
          new_steps = '''          <div class="demoStep">
            <b>3. iPad受付</b>
            来院受付と受付優先リストを見せる。
          </div>
          <div class="demoStep">
            <b>4. スタッフスマホ</b>
            担当患者・施術開始・施術完了を見せる。
          </div>
          <div class="demoStep">
            <b>5. 会員証</b>
            テスト太郎で予約と回数券を見せる。
          </div>
          <div class="demoStep">
            <b>6. お客様予約</b>
            新規予約・担当指名・空き時間を見せる。
          </div>'''
          system = regex_once(
              system,
              r'<div class="demoStep">\s*<b>3\.\s*iPad受付</b>\s*来院済み・施術中・回数券使用を見せる。\s*</div>\s*'
              r'<div class="demoStep">\s*<b>4\.\s*会員証</b>\s*テスト太郎で予約と回数券を見せる。\s*</div>\s*'
              r'<div class="demoStep">\s*<b>5\.\s*お客様予約</b>\s*新規予約・担当指名・空き時間を見せる。\s*</div>',
              new_steps,
              "system steps",
              re.S
          )
          old_ipad_card = '''          <div class="demoNavCard">
            <div class="demoNavTitle">受付・施術iPad</div>
            <div class="demoNavText">現場操作、来院済み、施術中、回数券使用を確認。</div>
            <a class="btn primary" id="openIpadLink" target="_blank" rel="noopener">開く</a>
            <div class="demoUrl" id="ipadUrlView">-</div>
          </div>'''
          new_ipad_card = '''          <div class="demoNavCard">
            <div class="demoNavTitle">iPad受付</div>
            <div class="demoNavText">受付優先リスト、来院受付、電話・店頭予約を確認。</div>
            <a class="btn primary" id="openIpadLink" target="_blank" rel="noopener">開く</a>
            <div class="demoUrl" id="ipadUrlView">-</div>
          </div>

          <div class="demoNavCard">
            <div class="demoNavTitle">スタッフスマホ</div>
            <div class="demoNavText">担当患者、施術待ち、施術開始・完了を確認。</div>
            <a class="btn primary" id="openStaffLink" target="_blank" rel="noopener">開く</a>
            <div class="demoUrl" id="staffUrlView">-</div>
          </div>'''
          system = regex_once(
              system,
              r'<div class="demoNavCard">\s*'
              r'<div class="demoNavTitle">受付・施術iPad</div>\s*'
              r'<div class="demoNavText">現場操作、来院済み、施術中、回数券使用を確認。</div>\s*'
              r'<a class="btn primary" id="openIpadLink" target="_blank" rel="noopener">開く</a>\s*'
              r'<div class="demoUrl" id="ipadUrlView">-</div>\s*</div>',
              new_ipad_card,
              "system staff card",
              re.S
          )
          system = replace_once(system, '      ipad: pageUrl("owner-ipad.html"),', '      ipad: pageUrl("owner-ipad.html"),\n      staff: pageUrl("staff.html"),', "system url map")
          system = replace_once(system, '    $("openIpadLink").href = urls.ipad;', '    $("openIpadLink").href = urls.ipad;\n    $("openStaffLink").href = urls.staff;', "system href")
          system = replace_once(system, '    $("ipadUrlView").textContent = urls.ipad;', '    $("ipadUrlView").textContent = urls.ipad;\n    $("staffUrlView").textContent = urls.staff;', "system url view")
          system = replace_once(system, '      `受付・施術iPad：${urls.ipad}`,', '      `iPad受付：${urls.ipad}`,\n      `スタッフスマホ：${urls.staff}`,', "system copied urls")
          system = replace_once(system, '      "3. iPadで来院済み・施術中・回数券使用を確認",\n      "4. 会員証で予約と回数券を確認",\n      "5. お客様予約で新規予約を確認"', '      "3. iPad受付で来院受付と受付優先リストを確認",\n      "4. スタッフスマホで施術開始・施術完了を確認",\n      "5. 会員証で予約と回数券を確認",\n      "6. お客様予約で新規予約を確認"', "system demo order")
          system_path.write_text(system, encoding="utf-8")

          config_path = Path("config.js")
          config = config_path.read_text(encoding="utf-8")
          config = replace_once(config, 'const STEP_VERSION = "STEP-SEITAI-NEXT-5-CONFIG-20260723";', 'const STEP_VERSION = "STEP-SEITAI-NEXT-6-CONFIG-20260723";', "config version")
          config_path.write_text(config, encoding="utf-8")
          PY

      - name: Run syntax and regression checks
        shell: bash
        run: |
          set -euo pipefail

          ruby -e 'require "yaml"; YAML.load_file(ENV.fetch("WORKFLOW_FILE"))'

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter
          import re

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
              def handle_starttag(self, tag, attrs):
                  for key,value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)

          for name in ["owner.html","owner-ipad.html","staff.html","system-check.html","index.html","member.html"]:
              text=Path(name).read_text(encoding="utf-8")
              parser=Checker(); parser.feed(text)
              duplicates=[key for key,count in Counter(parser.ids).items() if count>1]
              if duplicates:
                  raise SystemExit(f"{name}: duplicate ids {duplicates}")
              if "</html>" not in text.lower():
                  raise SystemExit(f"{name}: html closing tag missing")

          staff=Path("staff.html").read_text(encoding="utf-8")
          required_staff=["staffSelect","staffTabs","reservationList","/api/owner/visits/start","/api/owner/visits/complete","DPRO_SEITAI_ADMIN_CODE","clearAdminBtn","publicSettings","ownerToday"]
          for token in required_staff:
              if token not in staff: raise SystemExit(f"staff.html missing {token}")
          forbidden_staff=["/api/reservations/create","/api/owner/tickets/use","/api/owner/followups/update","saveBasicSettingsBtn","manualSubmitBtn"]
          for token in forbidden_staff:
              if token in staff: raise SystemExit(f"staff.html includes out-of-role function {token}")
          if "setInterval(" in staff:
              raise SystemExit("staff.html must not poll automatically")

          ipad=Path("owner-ipad.html").read_text(encoding="utf-8")
          required_ipad=["receptionFocusSection","receptionQueue","receptionOtherToggleBtn","staff.html","openIpadPhoneReserveBtn","openIpadWalkinReserveBtn","followupList","ticketList","next5GuideDrawer","workflowBoardSection"]
          for token in required_ipad:
              if token not in ipad: raise SystemExit(f"owner-ipad missing {token}")

          owner=Path("owner.html").read_text(encoding="utf-8")
          for token in ["staff.html","owner-ipad.html","patientLedgerSection","next5GuideDrawer"]:
              if token not in owner: raise SystemExit(f"owner missing {token}")

          system=Path("system-check.html").read_text(encoding="utf-8")
          for token in ["openStaffLink","staffUrlView",'staff: pageUrl("staff.html")',"スタッフスマホ"]:
              if token not in system: raise SystemExit(f"system-check missing {token}")

          before=Path("/tmp/config.before.js").read_text(encoding="utf-8")
          after=Path("config.js").read_text(encoding="utf-8")
          endpoints=["/api/health","/api/public/settings","/api/public/appointment-options","/api/reservations/create","/api/reservations/update","/api/reservations/cancel","/api/owner/today","/api/owner/settings","/api/owner/tickets/use","/api/owner/followups","/api/owner/customers/search","/api/owner/customers/detail","/api/admin/demo/reset","/api/admin/safety-check"]
          for endpoint in endpoints:
              if endpoint not in before or endpoint not in after:
                  raise SystemExit(f"config endpoint preservation failed: {endpoint}")

          for name in ["owner.html","owner-ipad.html","staff.html","system-check.html","config.js"]:
              if re.search(r'(?<![0-9])1234(?![0-9])',Path(name).read_text(encoding="utf-8")):
                  raise SystemExit(f"public fixed admin code found in {name}")

          if Path("staff.html").stat().st_size > 100_000:
              raise SystemExit("staff.html is unexpectedly large")
          PY

          python3 <<'PY'
          from pathlib import Path
          import re
          for html_name in ["owner.html","owner-ipad.html","staff.html","system-check.html","index.html","member.html"]:
              text=Path(html_name).read_text(encoding="utf-8")
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text,flags=re.I)
              for index,script in enumerate(scripts):
                  target=Path(f"/tmp/{html_name.replace('.html','')}-{index}.js")
                  target.write_text(script,encoding="utf-8")
                  print(target)
          PY
          for file in /tmp/owner-*.js /tmp/owner-ipad-*.js /tmp/staff-*.js /tmp/system-check-*.js /tmp/index-*.js /tmp/member-*.js; do
            [ -e "$file" ] || continue
            node --check "$file"
          done

          grep -q 'STEP SEITAI-NEXT-6' owner.html
          grep -q 'STEP SEITAI-NEXT-6' owner-ipad.html
          grep -q 'STEP SEITAI-NEXT-6' staff.html
          grep -q 'STEP-SEITAI-NEXT-6-CONFIG-20260723' config.js

