name: SEITAI Tutorial R3 QA Retry + R4 Standard V1.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seitai-tutorial-r3-r4-retry-v1.2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seitai-tutorial-r3-r4-retry-v1-2
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/seitai-tutorial-r3-r4-retry-v1.2.yml
  OLD_WORKFLOW_FILE: .github/workflows/seitai-tutorial-r3-r4-v1.1.yml
  R3_IMPLEMENTATION_HEAD: 0478aa9b9cae3e75de16f9666272b6bf33fee28b
  ACCEPTED_BASELINE_HEAD: b6d0a1a900b4e990cb81cf7526d367e2e8ec5a01
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/dpro-seitai-line/

jobs:
  r3:
    name: R3 exact LIVE QA retry against existing implementation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout newest forward-only main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify retry upload and existing R3 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$ACCEPTED_BASELINE_HEAD" HEAD
          git merge-base --is-ancestor "$R3_IMPLEMENTATION_HEAD" HEAD
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW_FILE"
          test -s tutorial.js
          test -s tutorial.css
          grep -q 'DPRO-TUTORIAL-SEITAI-STANDARD-V1.1-R3' tutorial.js
          test "$(grep -o 'id:"SEITAI-F10-' tutorial.js | wc -l)" -eq 10
          grep -q 'tutorial.css?v=seitai-tutorial-v1-1' index.html
          grep -q 'tutorial.js?v=seitai-tutorial-v1-1' index.html
          grep -q 'tutorial.css?v=seitai-tutorial-v1-1' member.html
          grep -q 'tutorial.js?v=seitai-tutorial-v1-1' member.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .dpro-qa qa/tutorial-r3
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/retry-upload-head.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/retry-pre-tree.txt

      - name: Prepare R3 QA in repository module scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQA'
          from pathlib import Path
          import base64
          Path('.dpro-qa').mkdir(exist_ok=True)
          Path('.dpro-qa/r3qa.mjs').write_bytes(base64.b64decode(''))
          PYQA

      - name: Confirm R3 GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            if curl -fsSL --max-time 20 "${PUBLIC_BASE}tutorial.js?qa=$GITHUB_RUN_ID-$i" | grep -q 'DPRO-TUTORIAL-SEITAI-STANDARD-V1.1-R3'               && curl -fsSL --max-time 20 "${PUBLIC_BASE}index.html?qa=$GITHUB_RUN_ID-$i" | grep -q 'tutorial.js?v=seitai-tutorial-v1-1'               && curl -fsSL --max-time 20 "${PUBLIC_BASE}member.html?qa=$GITHUB_RUN_ID-$i" | grep -q 'tutorial.js?v=seitai-tutorial-v1-1'; then
              exit 0
            fi
            sleep 5
          done
          echo "R3 GitHub Pages source is not visible" >&2
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run R3 exact four-width LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          node .dpro-qa/r3qa.mjs

      - name: Add R3 source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/tutorial-r3
          {
            echo "R3 QA RETRY SOURCE / SEITAI"
            echo "ACCEPTED_BASELINE_HEAD=$ACCEPTED_BASELINE_HEAD"
            echo "R3_IMPLEMENTATION_HEAD=$R3_IMPLEMENTATION_HEAD"
            echo "RETRY_TRIGGER_HEAD=$(cat /tmp/retry-upload-head.txt 2>/dev/null || echo NOT_AVAILABLE)"
            echo "FORWARD_ONLY=YES"
            echo "BUSINESS_MUTATION=0_REQUIRED"
            echo "QA_MODULE_SCOPE=REPOSITORY/.dpro-qa"
          } > qa/tutorial-r3/R3_SOURCE.txt
          git diff-tree --no-commit-id --name-only -r "$R3_IMPLEMENTATION_HEAD" > qa/tutorial-r3/R3_CHANGED_FILES.txt

      - name: Upload R3 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seitai-r3-live-qa-retry
          path: qa/tutorial-r3/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit R3 PASS evidence for R4 handoff
        shell: bash
        run: |
          set -euo pipefail
          test -s qa/tutorial-r3/r3-live-qa.json
          grep -Eq '"pass"[[:space:]]*:[[:space:]]*true' qa/tutorial-r3/r3-live-qa.json
          grep -Eq '"businessMutation"[[:space:]]*:[[:space:]]*0' qa/tutorial-r3/r3-live-qa.json
          git add qa/tutorial-r3/r3-live-qa.json qa/tutorial-r3/R3_SOURCE.txt qa/tutorial-r3/R3_CHANGED_FILES.txt
          git commit -m "SEITAI Tutorial R3 LIVE QA PASS evidence [skip ci]"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/r3-pass-head.txt

  r4:
    name: R4 Guide Center and exact LIVE QA
    needs: r3
    if: ${{ needs.r3.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout newest forward-only main after R3 PASS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify R3 PASS gate and forward-only ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$ACCEPTED_BASELINE_HEAD" HEAD
          git merge-base --is-ancestor "$R3_IMPLEMENTATION_HEAD" HEAD
          test -s qa/tutorial-r3/r3-live-qa.json
          grep -Eq '"pass"[[:space:]]*:[[:space:]]*true' qa/tutorial-r3/r3-live-qa.json
          grep -Eq '"businessMutation"[[:space:]]*:[[:space:]]*0' qa/tutorial-r3/r3-live-qa.json
          test -s tutorial.js
          test -s tutorial.css
          test "$(grep -o 'id:"SEITAI-F10-' tutorial.js | wc -l)" -eq 10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .dpro-qa qa/tutorial-r4

      - name: Implement R4 Guide Center only after R3 PASS
        shell: bash
        run: |
          set -euo pipefail
          test ! -e guide-center.html
          python3 - <<'PYR4'
          from pathlib import Path
          import base64
          Path('guide-center.html').write_bytes(base64.b64decode(''))
          Path('.dpro-qa').mkdir(exist_ok=True)
          Path('.dpro-qa/r4qa.mjs').write_bytes(base64.b64decode(''))
          PYR4
          grep -q 'window.DPRO_TUTORIAL_SEITAI' guide-center.html
          grep -q 'api.contract.forEach' guide-center.html
          grep -q 'id="guideStartBtn"' guide-center.html
          grep -q 'id="guideResumeBtn"' guide-center.html
          grep -q 'id="guideReplayBtn"' guide-center.html
          git add guide-center.html
          git commit -m "SEITAI Tutorial R4 Guide Center Standard V1.1"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/r4-implementation-head.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/r4-implementation-tree.txt

      - name: Wait for R4 GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            if curl -fsSL --max-time 20 "${PUBLIC_BASE}guide-center.html?qa=$GITHUB_RUN_ID-$i" | grep -q 'SEITAI Guide Center'; then
              exit 0
            fi
            sleep 5
          done
          echo "R4 GitHub Pages deployment did not become visible" >&2
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run R4 exact four-width LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          node .dpro-qa/r4qa.mjs

      - name: Add R4 source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/tutorial-r4
          {
            echo "R4 SOURCE / SEITAI"
            echo "R3=PASS"
            echo "R4_IMPLEMENTATION_HEAD=$(cat /tmp/r4-implementation-head.txt 2>/dev/null || echo NOT_AVAILABLE)"
            echo "R4_IMPLEMENTATION_TREE=$(cat /tmp/r4-implementation-tree.txt 2>/dev/null || echo NOT_AVAILABLE)"
            echo "FORWARD_ONLY=YES"
            echo "BUSINESS_MUTATION=0_REQUIRED"
          } > qa/tutorial-r4/R4_SOURCE.txt
          if [ -s /tmp/r4-implementation-head.txt ]; then
            git diff-tree --no-commit-id --name-only -r "$(cat /tmp/r4-implementation-head.txt)" > qa/tutorial-r4/R4_CHANGED_FILES.txt
          fi

      - name: Upload R4 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seitai-r4-live-qa
          path: qa/tutorial-r4/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit passed R3-R4 evidence and cleanup workflows
        shell: bash
        run: |
          set -euo pipefail
          test -s qa/tutorial-r3/r3-live-qa.json
          test -s qa/tutorial-r4/r4-live-qa.json
          grep -Eq '"pass"[[:space:]]*:[[:space:]]*true' qa/tutorial-r3/r3-live-qa.json
          grep -Eq '"pass"[[:space:]]*:[[:space:]]*true' qa/tutorial-r4/r4-live-qa.json
          grep -Eq '"businessMutation"[[:space:]]*:[[:space:]]*0' qa/tutorial-r3/r3-live-qa.json
          grep -Eq '"businessMutation"[[:space:]]*:[[:space:]]*0' qa/tutorial-r4/r4-live-qa.json
          r4_head="$(git rev-parse HEAD)"
          r4_tree="$(git rev-parse HEAD^{tree})"
          {
            echo "SOURCE LOCK R4 / SEITAI"
            echo
            echo "R2_CENTRAL=ACCEPTED"
            echo "R3=PASS"
            echo "R4=PASS"
            echo "FIRST10_COUNT=10"
            echo "GUIDE_COUNT=10"
            echo "R3_IMPLEMENTATION_HEAD=$R3_IMPLEMENTATION_HEAD"
            echo "R4_IMPLEMENTATION_HEAD=$r4_head"
            echo "R4_IMPLEMENTATION_TREE=$r4_tree"
            echo "BUSINESS_MUTATION=0"
            echo "FORWARD_ONLY=PASS"
            echo "R5=NOT_STARTED_NOT_AUTHORIZED"
            echo "R6=NOT_STARTED_NOT_AUTHORIZED"
            echo "R7=NOT_AUTHORIZED_NOT_EXECUTED"
            echo "FINAL_LOCK=CENTRAL_DECISION_ONLY"
          } > qa/tutorial-r4/SOURCE_LOCK_R4.txt
          git add qa/tutorial-r3 qa/tutorial-r4
          git rm -f "$WORKFLOW_FILE"
          if [ -f "$OLD_WORKFLOW_FILE" ]; then git rm -f "$OLD_WORKFLOW_FILE"; fi
          git commit -m "SEITAI Tutorial R4 QA PASS and workflow cleanup [skip ci]"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
