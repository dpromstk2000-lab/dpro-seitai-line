name: STEP SEITAI-NEXT-7

on:
  push:
    branches: [main]
    paths: [".github/workflows/STEP-SEITAI-NEXT-7.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seitai-next-7
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/STEP-SEITAI-NEXT-7.yml
  BACKUP_TAG: backup-seitai-before-next-7-20260723

jobs:
  member-history-repeat:
    name: Member history and repeat reservation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify previous STEP and create rollback tag
        shell: bash
        run: |
          set -euo pipefail
          test -f dpro-next-ledger.yml
          grep -q 'current_step: "SEITAI-NEXT-6-COMPLETE"' dpro-next-ledger.yml
          grep -q 'next_step: "SEITAI-NEXT-7"' dpro-next-ledger.yml
          for file in member.html index.html owner.html owner-ipad.html staff.html config.js system-check.html; do test -f "$file"; done

          BASELINE_SHA="$(git rev-parse HEAD^)"
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"

          if git rev-parse "$BACKUP_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$BACKUP_TAG")" = "$BASELINE_SHA"
          else
            git tag -a "$BACKUP_TAG" "$BASELINE_SHA" -m "DPRO 整骨院・整体 LINE before SEITAI-NEXT-7"
            git push origin "$BACKUP_TAG"
          fi

          git show "$BASELINE_SHA:member.html" > /tmp/member.before.html
          git show "$BASELINE_SHA:index.html" > /tmp/index.before.html
          git show "$BASELINE_SHA:config.js" > /tmp/config.before.js
          git show "$BASELINE_SHA:system-check.html" > /tmp/system-check.before.html

      - name: Apply member history and repeat reservation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: target not found")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, got {count}")
              return updated

          def insert_before_once(text, anchor, addition, label):
              if anchor not in text:
                  raise SystemExit(f"{label}: anchor not found")
              return text.replace(anchor, addition + "\n" + anchor, 1)

          member_css = base64.b64decode("").decode()
          member_overview = base64.b64decode("").decode()
          member_history = base64.b64decode("").decode()
          member_js = base64.b64decode("").decode()
          index_css = base64.b64decode("").decode()
          index_notice = base64.b64decode("").decode()
          index_js = base64.b64decode("").decode()

          member = Path("member.html").read_text(encoding="utf-8")
          index = Path("index.html").read_text(encoding="utf-8")
          config = Path("config.js").read_text(encoding="utf-8")
          system = Path("system-check.html").read_text(encoding="utf-8")

          # member.html
          member = regex_once(member, r'<!-- STEP SEITAI-[^>]+-->', '<!-- STEP SEITAI-NEXT-7: member history and repeat reservation / 20260723 -->', "member comment")
          member = regex_once(member, r'<title>DPRO 整骨院・整体 LINE｜会員証・予約確認｜[^<]+</title>', '<title>DPRO 整骨院・整体 LINE｜会員ホーム・来院履歴｜STEP SEITAI-NEXT-7</title>', "member title")
          member = regex_once(member, r'<script src="\./config\.js\?v=[^"]+"></script>', '<script src="./config.js?v=step-seitai-next-7"></script>', "member config version")
          member = insert_before_once(member, "  </style>", member_css, "member css")
          member = regex_once(member, r'<span class="badge">STEP SEITAI-[^<]+ / member\.html</span>', '<span class="badge">STEP SEITAI-NEXT-7 / member.html</span>', "member badge")
          member = regex_once(
              member,
              r'お客様がLINEから、会員証・現在の予約・回数券残数を確認できます。\s*予約変更・キャンセルもここから操作できます。',
              'お客様がLINEから、会員証・現在の予約・来院履歴・回数券を確認できます。\n          前回と同じ内容で予約することもできます。',
              "member lead"
          )
          member = replace_once(member, '<span class="chip">回数券</span>', '<span class="chip">回数券</span>\n          <span class="chip">来院履歴</span>', "member chip")

          member = regex_once(
              member,
              r'(?=<div class="card span8">\s*<div class="sectionHead">\s*<div>\s*<h2>現在の予約</h2>)',
              member_overview,
              "member overview",
              re.S
          )
          member = regex_once(
              member,
              r'<div class="card span6">\s*<h2>来院メモ</h2>\s*<p class="note">.*?</p>\s*<div id="recommendBox"[^>]*>.*?</div>\s*</div>',
              member_history,
              "member history card",
              re.S
          )
          member = replace_once(member, '    tickets: [],\n    menus: [],', '    tickets: [],\n    prefillSource: "member_history",\n    menus: [],', "member state")
          member = replace_once(
              member,
              '      apiGet(endpoint("memberReservations"), params).catch((error) => ({ ok:false, reservations:[], error: error.message }))',
              '      apiGet(endpoint("memberReservations"), { ...params, include_history:"1", limit:20 }).catch((error) => ({ ok:false, reservations:[], error: error.message }))',
              "member history query"
          )
          member = insert_before_once(member, "  function renderMember() {", member_js, "member js")
          member = replace_once(
              member,
              '    renderMember();\n    renderReservations();\n    renderTickets();\n    renderRecommend();',
              '    renderMember();\n    renderReservations();\n    renderTickets();\n    renderHistory();\n    renderMemberOverview();\n    renderRecommend();',
              "member render calls"
          )
          member = replace_once(member, '    const rows = state.reservations || [];\n\n    if (!state.customer) {', '    const rows = activeMemberReservations();\n\n    if (!state.customer) {', "member active rows")
          member = replace_once(member, '    const reservationCount = (state.reservations || []).length;', '    const reservationCount = activeMemberReservations().length;', "member recommend active count")
          member = replace_once(
              member,
              '    $("copyContactTextBtn").addEventListener("click", copyContactText);',
              '    $("copyContactTextBtn").addEventListener("click", copyContactText);\n    $("refreshMemberBtn").addEventListener("click", loadMember);',
              "member refresh event"
          )

          # index.html
          index = regex_once(index, r'<!-- STEP SEITAI-[^>]+-->', '<!-- STEP SEITAI-NEXT-7: member repeat reservation prefill / 20260723 -->', "index comment")
          index = regex_once(index, r'<title>DPRO 整骨院・整体 LINE｜[^<]+｜STEP SEITAI-[^<]+</title>', '<title>DPRO 整骨院・整体 LINE｜かんたん予約｜STEP SEITAI-NEXT-7</title>', "index title")
          index = regex_once(index, r'<script src="\./config\.js\?v=[^"]+"></script>', '<script src="./config.js?v=step-seitai-next-7"></script>', "index config version")
          index = insert_before_once(index, "  </style>", index_css, "index css")
          index = regex_once(index, r'<span class="badge">STEP SEITAI-[^<]+ / index\.html</span>', '<span class="badge">STEP SEITAI-NEXT-7 / index.html</span>', "index badge")
          index = insert_before_once(index, '          <section class="card span12" id="sectionMenu">', index_notice, "index prefill notice")
          index = replace_once(index, '    lastReservationResult: null\n  };', '    lastReservationResult: null,\n    prefillApplied: false\n  };', "index state")
          index = insert_before_once(index, "  async function loadSettings() {", index_js, "index prefill js")
          index = replace_once(
              index,
              '    state.selectedDate = $("dateInput").value;\n    updateDateLabel();',
              '    state.selectedDate = $("dateInput").value;\n    applyNext7Prefill();\n    updateDateLabel();',
              "index apply prefill"
          )
          index = replace_once(index, '        source: "line"', '        source: state.prefillApplied ? "member_repeat" : "line"', "index source")

          # config.js
          config = regex_once(config, r'const STEP_VERSION = "STEP-SEITAI-NEXT-\d+-CONFIG-\d+";', 'const STEP_VERSION = "STEP-SEITAI-NEXT-7-CONFIG-20260723";', "config version")

          # system-check.html: text-only update, no new API or controls.
          system = regex_once(system, r'<span class="badge">STEP SEITAI-[^<]+ / system-check\.html</span>', '<span class="badge">STEP SEITAI-NEXT-7 / system-check.html</span>', "system badge")
          system = replace_once(system, "テスト太郎で予約と回数券を見せる。", "テスト太郎で来院履歴・回数券・前回と同じ予約を見せる。", "system member step")
          system = replace_once(system, "テスト太郎で、会員証・予約・回数券を確認。", "テスト太郎で、来院履歴・回数券・前回と同じ予約を確認。", "system member card")
          system = replace_once(system, '"5. 会員証で予約と回数券を確認",', '"5. 会員証で来院履歴・回数券・前回と同じ予約を確認",', "system demo lines")

          Path("member.html").write_text(member, encoding="utf-8", newline="\n")
          Path("index.html").write_text(index, encoding="utf-8", newline="\n")
          Path("config.js").write_text(config, encoding="utf-8", newline="\n")
          Path("system-check.html").write_text(system, encoding="utf-8", newline="\n")
          PY

      - name: Run syntax and regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, subprocess, tempfile, json

          files = ["member.html","index.html","owner.html","owner-ipad.html","staff.html","system-check.html"]
          class Parser(HTMLParser):
              pass

          results = {}
          for name in files:
              text = Path(name).read_text(encoding="utf-8")
              Parser().feed(text)
              ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
              duplicates = sorted({x for x in ids if ids.count(x) > 1})
              if duplicates:
                  raise SystemExit(f"{name}: duplicate ids {duplicates}")

              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
              for i, code in enumerate(scripts):
                  if not code.strip():
                      continue
                  p = Path(tempfile.gettempdir()) / f"{name.replace('.','_')}_{i}.js"
                  p.write_text(code, encoding="utf-8")
                  subprocess.run(["node","--check",str(p)], check=True)
              results[name] = {"ids":len(ids),"inline_scripts":len(scripts),"bytes":len(text.encode())}

          # Existing member functions remain.
          member = Path("member.html").read_text(encoding="utf-8")
          for marker in [
              "memberProfile","memberTicket","memberReservations",
              "reservationUpdate","reservationCancel",
              "現在の予約","回数券","LINEで店舗へ連絡",
              "memberNext7Overview","memberHistorySection",
              "activeMemberReservations","historyMemberReservations",
              "repeatReservationUrl","include_history"
          ]:
              if marker not in member:
                  raise SystemExit(f"member marker missing: {marker}")
          if "/api/owner/" in member:
              raise SystemExit("member page must not use owner/admin endpoints")
          if member.count('apiGet(endpoint("memberProfile")') != 1:
              raise SystemExit("member profile request count changed")
          if member.count('apiGet(endpoint("memberTicket")') != 1:
              raise SystemExit("member ticket request count changed")
          if member.count('apiGet(endpoint("memberReservations")') != 1:
              raise SystemExit("member reservation request count changed")

          index = Path("index.html").read_text(encoding="utf-8")
          for marker in [
              "next7PrefillNotice","readNext7Prefill","applyNext7Prefill",
              'source: state.prefillApplied ? "member_repeat" : "line"',
              "menu_code","staff_preference","staff_code","preferred_date"
          ]:
              if marker not in index:
                  raise SystemExit(f"index prefill marker missing: {marker}")

          system = Path("system-check.html").read_text(encoding="utf-8")
          if "来院履歴・回数券・前回と同じ予約" not in system:
              raise SystemExit("system-check member guide not updated")

          config_before = Path("/tmp/config.before.js").read_text(encoding="utf-8")
          config_after = Path("config.js").read_text(encoding="utf-8")
          before_paths = sorted(set(re.findall(r'["\'](/api/[^"\']+)["\']', config_before)))
          after_paths = sorted(set(re.findall(r'["\'](/api/[^"\']+)["\']', config_after)))
          if before_paths != after_paths:
              raise SystemExit(f"config API endpoints changed: {before_paths} -> {after_paths}")
          before_api = re.search(r'apiBaseUrl:\s*"([^"]+)"', config_before).group(1)
          after_api = re.search(r'apiBaseUrl:\s*"([^"]+)"', config_after).group(1)
          if before_api != after_api:
              raise SystemExit("Worker API URL changed")

          for name in ["owner.html","owner-ipad.html","staff.html"]:
              before = Path(name).read_text(encoding="utf-8")
              for marker in ["DPRO 整骨院・整体 LINE","config.js"]:
                  if marker not in before:
                      raise SystemExit(f"{name}: existing screen marker missing {marker}")

          if Path("README.md").exists():
              raise SystemExit("README.md must not be created")

          Path("/tmp/next7-checks.json").write_text(json.dumps({
              "overall":"OK",
              "html_javascript":results,
              "member_initial_api_requests":3,
              "history_limit":20,
              "api_changed":False,
              "worker_changed":False,
              "supabase_changed":False
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          print("NEXT-7 checks OK")
          PY

          python3 - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path(".github/workflows/STEP-SEITAI-NEXT-7.yml").read_text(encoding="utf-8"))
          print("YML syntax OK")
          PY

      - name: Write NEXT ledger and check result
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S %z')"

          cat > dpro-next-ledger.yml <<EOF
          system_name: "DPRO 整骨院・整体 LINE"
          standard: "DPRO NEXT"
          step_name: "会員履歴・前回と同じ予約"
          current_step: "SEITAI-NEXT-7-COMPLETE"
          previous_step: "SEITAI-NEXT-6-COMPLETE"
          next_step: "SEITAI-NEXT-8"
          completed_at_jst: "$COMPLETED_AT"
          baseline_sha: "$BASELINE_SHA"
          backup_tag: "$BACKUP_TAG"
          backup_tag_status: "created"
          target_files:
            - "member.html"
            - "index.html"
            - "system-check.html"
            - "config.js"
          implemented:
            - "会員ホームの次回予約・来院回数・回数券集約"
            - "既存会員予約API結果の現在予約と来院履歴への分類"
            - "来院履歴の直近20件表示"
            - "前回メニュー・担当・要望の再予約URL"
            - "予約画面のURL事前入力"
            - "同一ブラウザ保存の次回来院目安表示"
            - "予約変更・キャンセル・回数券の既存機能維持"
          data_scope:
            member_history_endpoint: "existing memberReservations"
            include_history_parameter: true
            history_limit: 20
            additional_member_api_request: false
            next_visit_scope: "same browser localStorage only"
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            yml_syntax: "OK"
            html_syntax: "OK"
            javascript_syntax: "OK"
            html_id_duplicates: "OK"
            existing_function_preservation: "OK"
            member_history: "OK"
            repeat_reservation_url: "OK"
            index_prefill: "OK"
            member_role_restriction: "OK"
            api_unchanged: "OK"
            overall: "OK"
          change_record:
            worker_changed: false
            supabase_changed: false
            api_changed: false
            screen_function_changed: true
            new_screen_added: false
            existing_data_changed: false
          performance_policy:
            member_initial_api_requests: 3
            member_additional_initial_request: false
            history_limit: 20
            all_history_initial_unlimited_load: false
          rollback:
            method: "backup_tag"
            tag: "$BACKUP_TAG"
          workflow_self_delete_after_success: true
          auto_commit_push: true
          EOF

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          details = json.loads(Path("/tmp/next7-checks.json").read_text(encoding="utf-8"))
          result = {
              "ok": True,
              "step": "SEITAI-NEXT-7",
              "current_step": "SEITAI-NEXT-7-COMPLETE",
              "next_step": "SEITAI-NEXT-8",
              "baseline_sha": os.environ["BASELINE_SHA"],
              "backup_tag": os.environ["BACKUP_TAG"],
              "overall": "OK",
              "implemented": [
                  "member_home",
                  "visit_history",
                  "same_as_last_reservation",
                  "index_url_prefill",
                  "ticket_and_reservation_preserved"
              ],
              "history_source": "existing memberReservations with include_history=1",
              "history_limit": 20,
              "member_initial_api_requests": 3,
              "worker_changed": False,
              "supabase_changed": False,
              "api_changed": False,
              "screen_function_changed": True,
              "existing_data_changed": False,
              "details": details
          }
          Path("dpro-next-check-result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Remove workflow and commit completed STEP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$WORKFLOW_FILE"
          git add member.html index.html system-check.html config.js dpro-next-ledger.yml dpro-next-check-result.json "$WORKFLOW_FILE"
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "STEP SEITAI-NEXT-7 COMPLETE [skip ci]"
          git push origin HEAD:main
