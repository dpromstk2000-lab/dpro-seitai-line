name: STEP SEITAI-NEXT-8

on:
  push:
    branches: [main]
    paths: [".github/workflows/STEP-SEITAI-NEXT-8.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seitai-next-8
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/STEP-SEITAI-NEXT-8.yml
  BACKUP_TAG: backup-seitai-before-next-8-20260723

jobs:
  revisit-followup-center:
    name: Revisit and follow-up center
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify previous STEP and create rollback tag
        shell: bash
        run: |
          set -euo pipefail
          test -f dpro-next-ledger.yml
          grep -q 'current_step: "SEITAI-NEXT-7-COMPLETE"' dpro-next-ledger.yml
          grep -q 'next_step: "SEITAI-NEXT-8"' dpro-next-ledger.yml
          for file in owner.html member.html index.html owner-ipad.html staff.html config.js system-check.html; do test -f "$file"; done

          BASELINE_SHA="$(git rev-parse HEAD^)"
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"

          if git rev-parse "$BACKUP_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$BACKUP_TAG")" = "$BASELINE_SHA"
          else
            git tag -a "$BACKUP_TAG" "$BASELINE_SHA" -m "DPRO 整骨院・整体 LINE before SEITAI-NEXT-8"
            git push origin "$BACKUP_TAG"
          fi

          git show "$BASELINE_SHA:owner.html" > /tmp/owner.before.html
          git show "$BASELINE_SHA:config.js" > /tmp/config.before.js
          git show "$BASELINE_SHA:system-check.html" > /tmp/system-check.before.html

      - name: Apply revisit and follow-up center
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: target not found")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, got {count}")
              return updated

          owner = Path("owner.html").read_text(encoding="utf-8")
          config = Path("config.js").read_text(encoding="utf-8")
          system = Path("system-check.html").read_text(encoding="utf-8")

          css = base64.b64decode("").decode()
          section = base64.b64decode("").decode()
          js = base64.b64decode("").decode()

          owner = re.sub(r'<!-- STEP SEITAI-[^>]+-->', '<!-- STEP SEITAI-NEXT-8: revisit and follow-up center / 20260723 -->', owner, count=1)
          owner = re.sub(r'<title>DPRO 整骨院・整体 LINE｜オーナー管理｜[^<]+</title>', '<title>DPRO 整骨院・整体 LINE｜オーナー管理｜STEP SEITAI-NEXT-8</title>', owner, count=1)
          owner = re.sub(r'<script src="\./config\.js\?v=[^"]+"></script>', '<script src="./config.js?v=step-seitai-next-8"></script>', owner, count=1)

          if "DPRO NEXT-8: revisit and follow-up center" in owner:
              raise SystemExit("owner NEXT-8 marker already exists")

          owner = replace_once(owner, "\n  </style>", "\n" + css + "\n  </style>", "owner css")
          owner = regex_once(
              owner,
              r'\s*<div class="card span6" id="followupSection">.*?</div>\s*(?=<div class="card span6" id="ticketSection">)',
              "\n" + section + "\n",
              "followup section",
              re.S
          )
          owner = replace_once(owner, "\n  async function init() {", "\n" + js + "\n\n  async function init() {", "owner NEXT-8 javascript")

          config = re.sub(
              r'const STEP_VERSION = "[^"]+";',
              'const STEP_VERSION = "STEP-SEITAI-NEXT-8-CONFIG-20260723";',
              config,
              count=1
          )

          system = re.sub(
              r'<span class="badge">STEP SEITAI-[^<]+ / system-check\.html</span>',
              '<span class="badge">STEP SEITAI-NEXT-8 / system-check.html</span>',
              system,
              count=1
          )
          system = system.replace(
              "電話予約・店頭予約・今日やることを見せる。",
              "電話予約・今日やること・再来院フォローセンターを見せる。",
              1
          )
          system = system.replace(
              "テスト太郎で予約と回数券を見せる。",
              "テスト太郎で予約・来院履歴・前回と同じ予約を見せる。",
              1
          )

          Path("owner.html").write_text(owner, encoding="utf-8", newline="\n")
          Path("config.js").write_text(config, encoding="utf-8", newline="\n")
          Path("system-check.html").write_text(system, encoding="utf-8", newline="\n")
          PY

      - name: Run syntax and regression checks
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          import re
          import yaml

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def collect(self, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)
              def handle_starttag(self, tag, attrs):
                  self.collect(attrs)
              def handle_startendtag(self, tag, attrs):
                  self.collect(attrs)

          files = ["owner.html","member.html","index.html","owner-ipad.html","staff.html","system-check.html"]
          results = {}

          for name in files:
              text = Path(name).read_text(encoding="utf-8")
              parser = Parser()
              parser.feed(text)
              duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
              if duplicates:
                  raise SystemExit(f"{name}: duplicate ids {duplicates}")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, flags=re.S|re.I)
              for index, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  path = Path(f"/tmp/{Path(name).stem}-{index}.js")
                  path.write_text(script, encoding="utf-8")
              results[name] = {"ids":len(parser.ids),"inline_scripts":len(scripts)}

          yaml.safe_load(Path(".github/workflows/STEP-SEITAI-NEXT-8.yml").read_text(encoding="utf-8"))

          owner = Path("owner.html").read_text(encoding="utf-8")
          required = [
              "STEP SEITAI-NEXT-8",
              "再来院・フォローセンター",
              "followupOverdueCount",
              "followupTemplateSelect",
              "data-followup-filter",
              "next8FollowupMessage",
              "next8FollowupSort",
              "患者履歴・次回予約",
              "/api/owner/followups/update",
              "reloadFollowupsBtn",
              "clearAdminBtn",
              "ownerCustomerSearch",
              "ownerCustomerDetail",
              "next5Guide"
          ]
          missing = [token for token in required if token not in owner]
          if missing:
              raise SystemExit(f"owner required markers missing: {missing}")

          before_config = Path("/tmp/config.before.js").read_text(encoding="utf-8")
          after_config = Path("config.js").read_text(encoding="utf-8")
          endpoint_pattern = r'([A-Za-z][A-Za-z0-9]*):\s*"(/api/[^"]+)"'
          before_endpoints = dict(re.findall(endpoint_pattern, before_config))
          after_endpoints = dict(re.findall(endpoint_pattern, after_config))
          if before_endpoints != after_endpoints:
              raise SystemExit("API endpoint map changed unexpectedly")

          for token in [
              "reservationCreate","reservationUpdate","reservationCancel",
              "ownerToday","ownerTicketsUse","ownerFollowups",
              "ownerCustomerSearch","ownerCustomerDetail"
          ]:
              if token not in after_config:
                  raise SystemExit(f"config endpoint missing: {token}")

          checks = {
              "html_syntax":"OK",
              "javascript_extraction":"OK",
              "html_id_duplicates":"OK",
              "existing_function_preservation":"OK",
              "followup_metrics":"OK",
              "followup_filters":"OK",
              "followup_template_switch":"OK",
              "followup_copy_done_history":"OK",
              "next_visit_guide_reuse":"OK",
              "api_unchanged":"OK"
          }
          Path("/tmp/next8-static-check.json").write_text(
              json.dumps({"ok":True,"files":results,"checks":checks}, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

          for script in /tmp/owner-*.js /tmp/member-*.js /tmp/index-*.js /tmp/owner-ipad-*.js /tmp/staff-*.js /tmp/system-check-*.js; do
            [ -f "$script" ] || continue
            node --check "$script"
          done

      - name: Write NEXT ledger and check result
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S %z')"

          cat > dpro-next-ledger.yml <<EOF
          system_name: "DPRO 整骨院・整体 LINE"
          standard: "DPRO NEXT"
          step_name: "再来院・フォローセンター"
          current_step: "SEITAI-NEXT-8-COMPLETE"
          previous_step: "SEITAI-NEXT-7-COMPLETE"
          next_step: "SEITAI-NEXT-9"
          completed_at_jst: "$COMPLETED_AT"
          baseline_sha: "$BASELINE_SHA"
          backup_tag: "$BACKUP_TAG"
          backup_tag_status: "created"
          target_files:
            - "owner.html"
            - "config.js"
            - "system-check.html"
          implemented:
            - "期限超過・本日・7日以内・優先対応の集約"
            - "フォロー種類別フィルター"
            - "登録済み文面優先と施術後・久しぶり・回数券文面切替"
            - "期限までの日数・超過日数表示"
            - "次回来院目安の同一ブラウザ表示"
            - "文面編集・コピー・対応済み・患者履歴の一画面操作"
            - "対応済みの確認ダイアログ"
          data_scope:
            followup_endpoint: "existing ownerFollowups"
            followup_update_endpoint: "existing /api/owner/followups/update"
            additional_initial_api_request: false
            next_visit_scope: "same browser localStorage only"
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            yml_syntax: "OK"
            html_syntax: "OK"
            javascript_syntax: "OK"
            html_id_duplicates: "OK"
            existing_function_preservation: "OK"
            followup_metrics: "OK"
            followup_filters: "OK"
            followup_template_switch: "OK"
            followup_copy_done_history: "OK"
            api_unchanged: "OK"
            overall: "OK"
          change_record:
            worker_changed: false
            supabase_changed: false
            api_changed: false
            screen_function_changed: true
            new_screen_added: false
            existing_data_changed: false
          performance_policy:
            additional_initial_api_request: false
            all_followups_unlimited_history_load: false
            existing_owner_today_reused: true
          rollback:
            method: "backup_tag"
            tag: "$BACKUP_TAG"
          workflow_self_delete_after_success: true
          auto_commit_push: true
          EOF

          python3 <<'PY'
          from pathlib import Path
          import json

          static = json.loads(Path("/tmp/next8-static-check.json").read_text(encoding="utf-8"))
          result = {
              "ok": True,
              "system": "DPRO 整骨院・整体 LINE",
              "step": "SEITAI-NEXT-8",
              "current_step": "SEITAI-NEXT-8-COMPLETE",
              "next_step": "SEITAI-NEXT-9",
              "overall": "OK",
              "checks": static["checks"],
              "change_record": {
                  "worker_changed": False,
                  "supabase_changed": False,
                  "api_changed": False,
                  "screen_function_changed": True,
                  "existing_data_changed": False
              },
              "performance": {
                  "additional_initial_api_request": False,
                  "existing_owner_today_reused": True
              }
          }
          Path("dpro-next-check-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
              newline="\n"
          )
          PY

      - name: Remove workflow and commit completed STEP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$WORKFLOW_FILE"
          git add owner.html config.js system-check.html dpro-next-ledger.yml dpro-next-check-result.json "$WORKFLOW_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi

          git commit -m "STEP SEITAI-NEXT-8 COMPLETE [skip ci]"
          git push origin HEAD:main
