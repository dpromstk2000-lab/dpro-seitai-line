name: STEP SEITAI-NEXT-9-R1 VERIFY

on:
  push:
    branches: [main]
    paths: [".github/workflows/STEP-SEITAI-NEXT-9-R1-VERIFY.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seitai-next-9-r1-worker-verify
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/STEP-SEITAI-NEXT-9-R1-VERIFY.yml
  BACKUP_TAG: backup-seitai-before-next-9-r1-20260724
  WORKER_BASE_URL: https://dpro-seitai-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: STEP-SEITAI-NEXT-9-R1-PHONE-NFKC-20260724
  SHOP_CODE: dpro_seitai_demo

jobs:
  verify-worker-phone-normalization:
    name: Verify Worker NFKC phone normalization
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify NEXT-9 baseline and create rollback tag
        shell: bash
        run: |
          set -euo pipefail
          test -f dpro-next-ledger.yml
          test -f dpro-next-release-manifest.json
          test -f dpro-next-check-result.json
          grep -q 'current_step: "SEITAI-NEXT-9-COMPLETE"' dpro-next-ledger.yml
          grep -q 'next_step: "SEITAI-NEXT-10"' dpro-next-ledger.yml

          BASELINE_SHA="$(git rev-parse HEAD^)"
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
          if git rev-parse "$BACKUP_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$BACKUP_TAG")" = "$BASELINE_SHA"
          else
            git tag -a "$BACKUP_TAG" "$BASELINE_SHA" -m "DPRO 整骨院・整体 LINE before SEITAI-NEXT-9-R1 verification"
            git push origin "$BACKUP_TAG"
          fi

      - name: Verify YML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML syntax OK"' "$WORKFLOW_FILE"

      - name: Verify deployed Worker version and four phone formats
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base=os.environ["WORKER_BASE_URL"].rstrip("/")
          expected=os.environ["EXPECTED_WORKER_VERSION"]
          shop=os.environ["SHOP_CODE"]

          def get_json(path,params=None):
              query=urllib.parse.urlencode(params or {})
              url=f"{base}{path}" + (f"?{query}" if query else "")
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"DPRO-NEXT-9-R1-VERIFY"})
              with urllib.request.urlopen(req,timeout=30) as response:
                  return response.status,json.loads(response.read().decode("utf-8"))

          status,health=get_json("/api/health")
          actual=health.get("version") or health.get("worker_version")
          if status != 200 or health.get("ok") is False:
              raise SystemExit(f"Worker health NG: HTTP {status}")
          if actual != expected:
              raise SystemExit(f"Worker version mismatch: actual={actual!r} expected={expected!r}")

          variants=[
              "09011112222",
              "090-1111-2222",
              "０９０１１１１２２２",
              "+81 90 1111 2222",
          ]
          results=[]
          for value in variants:
              status,data=get_json("/api/member/profile",{"shop_code":shop,"phone":value})
              customer=data.get("customer") or {}
              identity=str(customer.get("id") or customer.get("customer_no") or "")
              if status != 200 or data.get("ok") is not True or not identity:
                  raise SystemExit(f"member profile lookup NG for format={value!r}: HTTP {status}")
              results.append({
                  "input":value,
                  "identity":identity,
                  "customer_no":customer.get("customer_no"),
                  "phone":customer.get("phone"),
              })

          identities={row["identity"] for row in results}
          if len(identities) != 1:
              safe=[{"input":row["input"],"matched":bool(row["identity"])} for row in results]
              raise SystemExit(f"phone formats did not resolve to one customer: {safe}")

          output={
              "ok":True,
              "worker_version":actual,
              "phone_formats_checked":len(variants),
              "same_customer":True,
              "write_request_used":False,
          }
          with open("/tmp/next9-r1-worker-verify.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          print(json.dumps(output,ensure_ascii=False,indent=2))
          PY

      - name: Update release manifest and NEXT ledger
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S %z')"
          export VERIFIED_AT

          python3 <<'PY'
          from pathlib import Path
          import json
          import os

          verified=json.loads(Path("/tmp/next9-r1-worker-verify.json").read_text(encoding="utf-8"))
          manifest=json.loads(Path("dpro-next-release-manifest.json").read_text(encoding="utf-8"))
          manifest["step"]="SEITAI-NEXT-9-R1"
          manifest["current_step"]="SEITAI-NEXT-9-R1-COMPLETE"
          manifest["next_step"]="SEITAI-NEXT-10"
          manifest["overall"]="OK"
          manifest["worker_runtime_verification"]={
              "status":"OK",
              "verified_at_jst":os.environ["VERIFIED_AT"],
              "worker_version":verified["worker_version"],
              "phone_formats_checked":verified["phone_formats_checked"],
              "same_customer":True,
              "write_request_used":False
          }
          manifest.setdefault("security",{})["phone_normalization_runtime_verified"]=True
          manifest.setdefault("change_record",{})["worker_changed"]=True
          manifest["change_record"]["api_changed"]=False
          manifest["change_record"]["supabase_changed"]=False
          manifest["change_record"]["existing_data_changed"]=False
          Path("dpro-next-release-manifest.json").write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )

          result=json.loads(Path("dpro-next-check-result.json").read_text(encoding="utf-8"))
          result.update({
              "step":"SEITAI-NEXT-9-R1",
              "current_step":"SEITAI-NEXT-9-R1-COMPLETE",
              "next_step":"SEITAI-NEXT-10",
              "overall":"OK",
              "worker_runtime_verification":manifest["worker_runtime_verification"]
          })
          result.setdefault("change_record",{})["worker_changed"]=True
          result["change_record"]["api_changed"]=False
          result["change_record"]["supabase_changed"]=False
          result["change_record"]["existing_data_changed"]=False
          Path("dpro-next-check-result.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY

          cat > dpro-next-ledger.yml <<EOF
          system_name: "DPRO 整骨院・整体 LINE"
          standard: "DPRO NEXT"
          step_name: "Worker電話番号NFKC正規化・実行再監査"
          current_step: "SEITAI-NEXT-9-R1-COMPLETE"
          previous_step: "SEITAI-NEXT-9-COMPLETE"
          next_step: "SEITAI-NEXT-10"
          completed_at_jst: "$VERIFIED_AT"
          baseline_sha: "$BASELINE_SHA"
          backup_tag: "$BACKUP_TAG"
          backup_tag_status: "created_or_verified"
          worker:
            name: "dpro-seitai-line-api"
            url: "$WORKER_BASE_URL"
            previous_version: "STEP-SEITAI-10G-R2-PHONE-NORMALIZED-CUSTOMER-SEARCH-20260709"
            current_version: "$EXPECTED_WORKER_VERSION"
            deploy_performed_by_user: true
          implemented:
            - "電話番号入力へUnicode NFKC正規化を追加"
            - "全角数字・各種ハイフン・括弧・空白を正規化"
            - "+81・0081を国内0始まりへ正規化"
            - "公開会員APIで4表記が同一患者になることを自動検証"
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            yml_syntax: "OK"
            worker_health: "OK"
            worker_version: "OK"
            halfwidth_digits: "OK"
            hyphenated_phone: "OK"
            fullwidth_digits: "OK"
            international_plus81: "OK"
            same_customer_identity: "OK"
            write_request_used: "false"
            overall: "OK"
          change_record:
            worker_changed: true
            worker_behavior_changed: true
            api_path_changed: false
            api_response_contract_changed: false
            supabase_changed: false
            github_screen_changed: false
            existing_data_changed: false
          rollback:
            worker_method: "redeploy_previous_worker"
            previous_version: "STEP-SEITAI-10G-R2-PHONE-NORMALIZED-CUSTOMER-SEARCH-20260709"
            github_method: "backup_tag"
            github_tag: "$BACKUP_TAG"
          workflow_self_delete_after_success: true
          auto_commit_push: true
          EOF

      - name: Remove workflow and commit verified STEP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$WORKFLOW_FILE"
          git add dpro-next-ledger.yml dpro-next-check-result.json dpro-next-release-manifest.json "$WORKFLOW_FILE"
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "STEP SEITAI-NEXT-9-R1 COMPLETE [skip ci]"
          git push origin HEAD:main
