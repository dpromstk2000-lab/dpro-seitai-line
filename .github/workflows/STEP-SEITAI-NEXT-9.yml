name: STEP SEITAI-NEXT-9

on:
  push:
    branches: [main]
    paths: [".github/workflows/STEP-SEITAI-NEXT-9.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seitai-next-9
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/STEP-SEITAI-NEXT-9.yml
  BACKUP_TAG: backup-seitai-before-next-9-20260723

jobs:
  performance-security-system-check:
    name: Performance security and release audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify previous STEP and create rollback tag
        shell: bash
        run: |
          set -euo pipefail
          test -f dpro-next-ledger.yml
          grep -q 'current_step: "SEITAI-NEXT-8-COMPLETE"' dpro-next-ledger.yml
          grep -q 'next_step: "SEITAI-NEXT-9"' dpro-next-ledger.yml

          for file in index.html member.html owner.html owner-ipad.html staff.html system-check.html config.js dpro-next-check-result.json; do
            test -f "$file"
          done

          BASELINE_SHA="$(git rev-parse HEAD^)"
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"

          if git rev-parse "$BACKUP_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$BACKUP_TAG")" = "$BASELINE_SHA"
          else
            git tag -a "$BACKUP_TAG" "$BASELINE_SHA" -m "DPRO 整骨院・整体 LINE before SEITAI-NEXT-9"
            git push origin "$BACKUP_TAG"
          fi

          git show "$BASELINE_SHA:config.js" > /tmp/config.before.js
          git show "$BASELINE_SHA:system-check.html" > /tmp/system-check.before.html

      - name: Apply NEXT-9 configuration and release audit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: target not found")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, got {count}")
              return updated

          config = Path("config.js").read_text(encoding="utf-8")
          system = Path("system-check.html").read_text(encoding="utf-8")

          css = base64.b64decode("").decode()
          audit_html = base64.b64decode("").decode()
          audit_js = base64.b64decode("").decode()
          policy = base64.b64decode("").decode()

          config = re.sub(
              r'const STEP_VERSION = "[^"]+";',
              'const STEP_VERSION = "STEP-SEITAI-NEXT-9-CONFIG-20260723";',
              config,
              count=1
          )
          config = re.sub(
              r'pagesBaseUrl:\s*"[^"]*",',
              'pagesBaseUrl: "https://dpromstk2000-lab.github.io/dpro-seitai-line/",',
              config,
              count=1
          )

          if "performance: {" not in config:
              config = replace_once(
                  config,
                  "    endpoints: {",
                  policy + "\n\n    endpoints: {",
                  "config policy"
              )

          system = system.replace("<!doctype html>　　", "<!doctype html>", 1)
          system = re.sub(
              r'<title>DPRO 整骨院・整体 LINE｜System Check｜[^<]+</title>',
              '<title>DPRO 整骨院・整体 LINE｜System Check｜STEP SEITAI-NEXT-9</title>',
              system,
              count=1
          )
          system = re.sub(
              r'<script src="\./config\.js\?v=[^"]+"></script>',
              '<script src="./config.js?v=step-seitai-next-9"></script>',
              system,
              count=1
          )
          system = re.sub(
              r'<span class="badge">STEP SEITAI-[^<]+ / system-check\.html</span>',
              '<span class="badge">STEP SEITAI-NEXT-9 / system-check.html</span>',
              system,
              count=1
          )

          if "DPRO NEXT-9: release audit" in system:
              raise SystemExit("system-check NEXT-9 marker already exists")

          system = replace_once(system, "\n  </style>", "\n" + css + "\n  </style>", "system-check CSS")

          system = regex_once(
              system,
              r'\s*<div class="card span6">\s*<h2>7\. 操作ログ</h2>',
              "\n" + audit_html,
              "release audit section",
              re.S
          )
          system = system.replace("<h2>8. APIレスポンス</h2>", "<h2>9. APIレスポンス</h2>", 1)

          system = replace_once(
              system,
              '      ownerToday: "/api/owner/today",\n      demoReset: "/api/admin/demo/reset",',
              '      ownerToday: "/api/owner/today",\n      ownerCustomerSearch: "/api/owner/customers/search",\n      demoReset: "/api/admin/demo/reset",',
              "fallback customer endpoint"
          )

          system = replace_once(
              system,
              "\n  function init() {",
              "\n" + audit_js + "\n\n  function init() {",
              "system-check audit JS"
          )
          system = replace_once(
              system,
              "    updateAdminStatus();\n    renderDemoLinks();",
              "    updateAdminStatus();\n    renderDemoLinks();\n    next9InitAudit();",
              "audit initialization"
          )

          system = re.sub(
              r'\s*<section class="card" id="next5StaticCheck".*?</section>',
              "",
              system,
              count=1,
              flags=re.S
          )

          Path("config.js").write_text(config, encoding="utf-8", newline="\n")
          Path("system-check.html").write_text(system, encoding="utf-8", newline="\n")
          PY

      - name: Run full static security and performance checks
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import hashlib
          import json
          import re
          import yaml

          public_files = [
              "index.html",
              "member.html",
              "owner.html",
              "owner-ipad.html",
              "staff.html",
              "system-check.html",
              "config.js"
          ]
          required_files = public_files + [
              "dpro-next-ledger.yml",
              "dpro-next-check-result.json"
          ]
          budgets = {
              "index.html": 550 * 1024,
              "member.html": 550 * 1024,
              "owner.html": 950 * 1024,
              "owner-ipad.html": 550 * 1024,
              "staff.html": 450 * 1024,
              "system-check.html": 650 * 1024,
              "config.js": 100 * 1024
          }

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def collect(self, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)
              def handle_starttag(self, tag, attrs):
                  self.collect(attrs)
              def handle_startendtag(self, tag, attrs):
                  self.collect(attrs)

          for name in required_files:
              if not Path(name).is_file():
                  raise SystemExit(f"required file missing: {name}")

          html_details = {}
          scripts = []
          for name in [f for f in public_files if f.endswith(".html")]:
              text = Path(name).read_text(encoding="utf-8")
              parser = Parser()
              parser.feed(text)
              duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
              if duplicates:
                  raise SystemExit(f"{name}: duplicate ids {duplicates}")
              inline = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, flags=re.S|re.I)
              for index, source in enumerate(inline):
                  if not source.strip():
                      continue
                  path = Path(f"/tmp/{Path(name).stem}-{index}.js")
                  path.write_text(source, encoding="utf-8")
                  scripts.append(str(path))
              html_details[name] = {"ids":len(parser.ids),"inline_scripts":len(inline)}

          yaml.safe_load(Path(".github/workflows/STEP-SEITAI-NEXT-9.yml").read_text(encoding="utf-8"))

          security_hits = []
          forbidden_patterns = [
              (r'(?<!\d)1234(?!\d)', "literal demo admin code"),
              (r'今回は\s*1234', "public demo code explanation"),
              (r'管理コード[^\n<]{0,40}1234', "public admin code label")
          ]
          for name in public_files:
              text = Path(name).read_text(encoding="utf-8")
              for pattern, label in forbidden_patterns:
                  if re.search(pattern, text, flags=re.I):
                      security_hits.append(f"{name}: {label}")
          if security_hits:
              raise SystemExit("public admin code scan failed: " + "; ".join(security_hits))

          protected = {
              "owner.html":"clearAdminBtn",
              "owner-ipad.html":"clearAdminBtn",
              "staff.html":"clearAdminBtn",
              "system-check.html":"clearAdminBtn"
          }
          for name, marker in protected.items():
              if marker not in Path(name).read_text(encoding="utf-8"):
                  raise SystemExit(f"admin delete control missing: {name}")

          before_config = Path("/tmp/config.before.js").read_text(encoding="utf-8")
          after_config = Path("config.js").read_text(encoding="utf-8")
          endpoint_pattern = r'([A-Za-z][A-Za-z0-9]*):\s*"(/api/[^"]+)"'
          before_endpoints = dict(re.findall(endpoint_pattern, before_config))
          after_endpoints = dict(re.findall(endpoint_pattern, after_config))
          if before_endpoints != after_endpoints:
              raise SystemExit("API endpoint map changed unexpectedly")

          required_config = [
              'pagesBaseUrl: "https://dpromstk2000-lab.github.io/dpro-seitai-line/"',
              'defaultSlotMinutes: 30',
              'prohibitEmbeddedAdminCode: true',
              'initialOwnerScope: "selected-day"',
              'patientSearchLimit: 20',
              'patientHistoryLimit: 40',
              'memberHistoryLimit: 20',
              'autoPolling: false'
          ]
          missing_config = [token for token in required_config if token not in after_config]
          if missing_config:
              raise SystemExit(f"config policy missing: {missing_config}")

          if not re.search(r'apiBaseUrl:\s*"https://', after_config):
              raise SystemExit("Worker API is not HTTPS")

          combined = "\n".join(Path(name).read_text(encoding="utf-8") for name in public_files)
          if "setInterval(" in combined:
              raise SystemExit("automatic polling found in public files")

          owner = Path("owner.html").read_text(encoding="utf-8")
          member = Path("member.html").read_text(encoding="utf-8")
          system = Path("system-check.html").read_text(encoding="utf-8")

          if "患者を選んだ時だけ履歴を取得" not in owner:
              raise SystemExit("lazy patient history marker missing")
          if not re.search(r'limit:\s*20', owner):
              raise SystemExit("patient search limit marker missing")
          if 'endpoint("ownerToday")' not in owner or "state.date" not in owner:
              raise SystemExit("selected day scope marker missing")
          if "next5TicketBusy" not in owner or "setBusy(" not in owner:
              raise SystemExit("duplicate action guard marker missing")
          if "include_history" not in member:
              raise SystemExit("member history limit marker missing")

          for token in [
              "dpro-next-release-manifest.json",
              "runNext9RuntimeAudit",
              "無効な管理コードの拒否",
              "電話番号表記揺れ"
          ]:
              if token not in system:
                  raise SystemExit(f"release audit marker missing: {token}")

          if "next5StaticCheck" in system:
              raise SystemExit("obsolete NEXT-5 static card remains")
          if "STEP SEITAI-NEXT-9" not in system:
              raise SystemExit("system-check version marker missing")

          file_info = {}
          total_bytes = 0
          for name in public_files:
              raw = Path(name).read_bytes()
              size = len(raw)
              total_bytes += size
              budget = budgets[name]
              if size > budget:
                  raise SystemExit(f"{name} exceeds budget: {size} > {budget}")
              file_info[name] = {
                  "bytes": size,
                  "budget_bytes": budget,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "within_budget": True
              }

          if total_bytes > 3 * 1024 * 1024:
              raise SystemExit(f"public file total exceeds 3MB: {total_bytes}")

          checks = {
              "required_files":"OK",
              "html_syntax":"OK",
              "javascript_syntax":"PENDING_NODE_CHECK",
              "html_id_duplicates":"OK",
              "public_admin_code_scan":"OK",
              "endpoint_map_unchanged":"OK",
              "https_endpoints":"OK",
              "admin_delete_controls":"OK",
              "slot_30_minutes":"OK",
              "performance_budgets":"OK",
              "no_auto_polling":"OK",
              "lazy_history":"OK",
              "selected_day_scope":"OK",
              "duplicate_action_guard":"OK",
              "obsolete_check_removed":"OK",
              "release_manifest":"OK"
          }
          details = {
              "required_files":"予約・会員・PC・iPad・スタッフ・system-check・共通設定を確認",
              "html_syntax":f"HTML {len(html_details)}画面を解析",
              "javascript_syntax":f"インラインJavaScript {len(scripts)}本をNode.jsで検査",
              "html_id_duplicates":"本物のHTML id属性だけを検査",
              "public_admin_code_scan":"公開画面に固定管理コード値なし",
              "endpoint_map_unchanged":f"既存API定義 {len(after_endpoints)}件を維持",
              "https_endpoints":"Worker API・GitHub PagesともHTTPS",
              "admin_delete_controls":"保護画面4ページに削除操作あり",
              "slot_30_minutes":"共通設定の予約枠は30分",
              "performance_budgets":f"公開ファイル合計 {total_bytes} bytes / 上限 3MB",
              "no_auto_polling":"setIntervalによる自動監視なし",
              "lazy_history":"患者選択時だけ履歴取得・件数上限あり",
              "selected_day_scope":"オーナー初期取得は指定日単位",
              "duplicate_action_guard":"ボタン無効化と回数券処理中ロックあり",
              "obsolete_check_removed":"旧NEXT-5確認カードを除去",
              "release_manifest":"system-checkから静的監査結果を表示可能"
          }

          Path("/tmp/next9-static.json").write_text(
              json.dumps({
                  "ok":True,
                  "checks":checks,
                  "details":details,
                  "files":file_info,
                  "total_bytes":total_bytes,
                  "scripts":scripts
              },ensure_ascii=False,indent=2),
              encoding="utf-8"
          )
          PY

          for script in /tmp/index-*.js /tmp/member-*.js /tmp/owner-*.js /tmp/owner-ipad-*.js /tmp/staff-*.js /tmp/system-check-*.js; do
            [ -f "$script" ] || continue
            node --check "$script"
          done

      - name: Generate public release manifest
        shell: bash
        run: |
          set -euo pipefail
          GENERATED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S %z')"
          export GENERATED_AT

          python3 <<'PY'
          from pathlib import Path
          import json
          import os

          data=json.loads(Path("/tmp/next9-static.json").read_text(encoding="utf-8"))
          data["checks"]["javascript_syntax"]="OK"

          manifest={
              "ok":True,
              "system":"DPRO 整骨院・整体 LINE",
              "standard":"DPRO NEXT",
              "step":"SEITAI-NEXT-9",
              "current_step":"SEITAI-NEXT-9-COMPLETE",
              "next_step":"SEITAI-NEXT-10",
              "overall":"OK",
              "generated_at_jst":os.environ["GENERATED_AT"],
              "files":data["files"],
              "checks":data["checks"],
              "details":data["details"],
              "performance":{
                  "public_total_bytes":data["total_bytes"],
                  "public_total_budget_bytes":3*1024*1024,
                  "auto_polling":False,
                  "owner_initial_scope":"selected-day",
                  "patient_search_limit":20,
                  "patient_history_limit":40,
                  "member_history_limit":20
              },
              "security":{
                  "embedded_admin_code":False,
                  "admin_delete_controls":True,
                  "invalid_admin_runtime_check_available":True,
                  "past_date_runtime_check_available":True,
                  "phone_normalization_runtime_check_available":True
              },
              "change_record":{
                  "worker_changed":False,
                  "supabase_changed":False,
                  "api_changed":False,
                  "existing_data_changed":False
              }
          }

          Path("dpro-next-release-manifest.json").write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2),
              encoding="utf-8",
              newline="\n"
          )
          PY

      - name: Write NEXT ledger and check result
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S %z')"

          cat > dpro-next-ledger.yml <<EOF
          system_name: "DPRO 整骨院・整体 LINE"
          standard: "DPRO NEXT"
          step_name: "性能・セキュリティ・system-check最終監査"
          current_step: "SEITAI-NEXT-9-COMPLETE"
          previous_step: "SEITAI-NEXT-8-COMPLETE"
          next_step: "SEITAI-NEXT-10"
          completed_at_jst: "$COMPLETED_AT"
          baseline_sha: "$BASELINE_SHA"
          backup_tag: "$BACKUP_TAG"
          backup_tag_status: "created"
          target_files:
            - "config.js"
            - "system-check.html"
            - "dpro-next-release-manifest.json"
          implemented:
            - "公開ファイル静的監査結果の生成"
            - "全画面HTML・JavaScript・重複ID検査"
            - "固定管理コード公開残存検査"
            - "API定義維持・HTTPS・管理コード削除操作検査"
            - "画面別容量・合計容量の性能予算"
            - "不要な自動監視・無制限履歴取得の防止"
            - "無効管理コード・過去日・電話番号表記揺れの読取専用実行監査"
            - "古いNEXT-5確認カードとsystem-check旧版表示の整理"
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            yml_syntax: "OK"
            html_syntax: "OK"
            javascript_syntax: "OK"
            html_id_duplicates: "OK"
            public_admin_code_scan: "OK"
            endpoint_map_unchanged: "OK"
            https_endpoints: "OK"
            admin_delete_controls: "OK"
            slot_30_minutes: "OK"
            performance_budgets: "OK"
            no_auto_polling: "OK"
            lazy_history: "OK"
            selected_day_scope: "OK"
            duplicate_action_guard: "OK"
            release_manifest: "OK"
            overall: "OK"
          change_record:
            worker_changed: false
            supabase_changed: false
            api_changed: false
            screen_function_changed: true
            new_file_added: "dpro-next-release-manifest.json"
            existing_data_changed: false
          runtime_audit:
            invalid_admin_rejection: "system-checkで実行"
            past_date_guard: "system-checkで実行"
            phone_normalization: "system-checkで実行"
            write_request_used: false
          rollback:
            method: "backup_tag"
            tag: "$BACKUP_TAG"
          workflow_self_delete_after_success: true
          auto_commit_push: true
          EOF

          python3 <<'PY'
          from pathlib import Path
          import json

          manifest=json.loads(Path("dpro-next-release-manifest.json").read_text(encoding="utf-8"))
          result={
              "ok":True,
              "system":"DPRO 整骨院・整体 LINE",
              "step":"SEITAI-NEXT-9",
              "current_step":"SEITAI-NEXT-9-COMPLETE",
              "next_step":"SEITAI-NEXT-10",
              "overall":"OK",
              "checks":manifest["checks"],
              "change_record":manifest["change_record"],
              "runtime_audit":{
                  "location":"system-check.html",
                  "read_only":True,
                  "invalid_admin_rejection":True,
                  "past_date_guard":True,
                  "phone_normalization":True
              }
          }
          Path("dpro-next-check-result.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2),
              encoding="utf-8",
              newline="\n"
          )
          PY

      - name: Remove workflow and commit completed STEP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$WORKFLOW_FILE"
          git add config.js system-check.html dpro-next-release-manifest.json dpro-next-ledger.yml dpro-next-check-result.json "$WORKFLOW_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi

          git commit -m "STEP SEITAI-NEXT-9 COMPLETE [skip ci]"
          git push origin HEAD:main
