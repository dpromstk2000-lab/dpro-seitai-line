      - name: Final repository diff guard
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import json
          import subprocess

          expected = {
              ".github/workflows/STEP-SEITAI-NEXT-4.yml",
              "owner.html",
              "owner-ipad.html",
              "config.js",
              "dpro-next-ledger.yml",
              "dpro-next-check-result.json",
          }
          changed = set(subprocess.check_output(["git", "status", "--short"], text=True).splitlines())
          changed_paths = {line[3:] for line in changed}
          unexpected = sorted(changed_paths - expected)
          if unexpected:
              raise SystemExit(f"Unexpected changed files: {unexpected}")

          ledger = Path("dpro-next-ledger.yml").read_text(encoding="utf-8")
          required = [
              'current_step: "SEITAI-NEXT-4-COMPLETE"',
              'next_step: "SEITAI-NEXT-5"',
              'worker_changed: false',
              'supabase_changed: false',
              'api_changed: false',
              'overall: "OK"',
          ]
          for marker in required:
              if marker not in ledger:
                  raise SystemExit(f"Ledger marker missing: {marker}")

          result = json.loads(Path("dpro-next-check-result.json").read_text(encoding="utf-8"))
          if result.get("ok") is not True or result.get("overall") != "OK":
              raise SystemExit("Check result is not OK.")
          PY

      - name: Remove successful workflow and commit
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$WORKFLOW_FILE"

          git add owner.html owner-ipad.html config.js dpro-next-ledger.yml dpro-next-check-result.json
          git add -u "$WORKFLOW_FILE"

          if git diff --cached --quiet; then
            echo "No staged changes were produced."
            exit 1
          fi

          git commit -m "STEP SEITAI-NEXT-4 COMPLETE [skip ci]"
          git push origin HEAD:main
