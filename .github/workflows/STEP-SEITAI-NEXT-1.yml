name: "STEP SEITAI-NEXT-1 | 正常版保護・現状基準台帳"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/STEP-SEITAI-NEXT-1.yml"

permissions:
  contents: write

concurrency:
  group: seitai-next-1-baseline
  cancel-in-progress: false

jobs:
  baseline-protection:
    name: "SEITAI-NEXT-1 baseline protection"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WORKFLOW_PATH: ".github/workflows/STEP-SEITAI-NEXT-1.yml"
      BACKUP_TAG: "backup-seitai-before-next-20260723"
      LEDGER_FILE: "dpro-next-ledger.yml"
      BASELINE_FILE: "dpro-next-baseline.json"
      MANIFEST_FILE: "dpro-next-file-manifest.txt"
      RESULT_FILE: "dpro-next-check-result.json"

    steps:
      - name: "1. Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "2. 前STEP・対象ファイル確認"
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            "index.html"
            "member.html"
            "owner.html"
            "owner-ipad.html"
            "system-check.html"
            "config.js"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::必須ファイルがありません。"
              missing=1
            fi
          done

          if [[ ! -f "$WORKFLOW_PATH" ]]; then
            echo "::error file=$WORKFLOW_PATH::指定されたSTEP YMLが所定位置にありません。"
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          mapfile -t head_changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          baseline_sha="$(git rev-parse HEAD)"

          if [[ "${#head_changed[@]}" -eq 1 && "${head_changed[0]}" == "$WORKFLOW_PATH" ]]; then
            baseline_sha="$(git rev-parse HEAD^)"
            baseline_reason="workflow_upload_parent"
          else
            baseline_reason="current_head"
          fi

          echo "BASELINE_SHA=$baseline_sha" >> "$GITHUB_ENV"
          echo "BASELINE_REASON=$baseline_reason" >> "$GITHUB_ENV"
          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"

          {
            echo "### STEP SEITAI-NEXT-1"
            echo "- 前STEP: 初回基準台帳のためなし"
            echo "- 必須ファイル: OK"
            echo "- 正常版基準SHA: \`$baseline_sha\`"
            echo "- 基準判定: \`$baseline_reason\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "3. 変更前バックアップタグ"
        shell: bash
        run: |
          set -Eeuo pipefail

          if git rev-parse "$BACKUP_TAG" >/dev/null 2>&1; then
            existing_sha="$(git rev-list -n 1 "$BACKUP_TAG")"
            if [[ "$existing_sha" != "$BASELINE_SHA" ]]; then
              echo "::error::既存タグ $BACKUP_TAG は別SHAを指しています。既存=$existing_sha / 今回=$BASELINE_SHA"
              exit 1
            fi
            tag_status="existing_same_sha"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$BACKUP_TAG" "$BASELINE_SHA" -m "DPRO 整骨院・整体 LINE before DPRO NEXT baseline"
            git push origin "$BACKUP_TAG"
            tag_status="created"
          fi

          echo "BACKUP_TAG_STATUS=$tag_status" >> "$GITHUB_ENV"

          {
            echo "- バックアップタグ: \`$BACKUP_TAG\`"
            echo "- タグ状態: \`$tag_status\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "4. YML構文検査"
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML syntax OK"' "$WORKFLOW_PATH"

      - name: "5. 現状基準台帳・構文・ID・機能維持検査"
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import collections
          import datetime as dt
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from html.parser import HTMLParser
          from pathlib import Path

          ROOT = Path(".")
          WORKFLOW_PATH = Path(os.environ["WORKFLOW_PATH"])
          BACKUP_TAG = os.environ["BACKUP_TAG"]
          BASELINE_SHA = os.environ["BASELINE_SHA"]
          BASELINE_REASON = os.environ["BASELINE_REASON"]
          TAG_STATUS = os.environ.get("BACKUP_TAG_STATUS", "unknown")
          LEDGER_FILE = Path(os.environ["LEDGER_FILE"])
          BASELINE_FILE = Path(os.environ["BASELINE_FILE"])
          MANIFEST_FILE = Path(os.environ["MANIFEST_FILE"])
          RESULT_FILE = Path(os.environ["RESULT_FILE"])

          REQUIRED = [
              "index.html",
              "member.html",
              "owner.html",
              "owner-ipad.html",
              "system-check.html",
              "config.js",
          ]

          GENERATED = {
              str(LEDGER_FILE),
              str(BASELINE_FILE),
              str(MANIFEST_FILE),
              str(RESULT_FILE),
          }

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.scripts = []
                  self.script_srcs = []
                  self._in_script = False
                  self._script_type = ""
                  self._script_parts = []

              def handle_starttag(self, tag, attrs):
                  attrs_dict = dict(attrs)
                  element_id = attrs_dict.get("id")
                  if element_id:
                      self.ids.append(element_id)

                  if tag.lower() == "script":
                      self._in_script = True
                      self._script_type = (attrs_dict.get("type") or "").lower()
                      self._script_parts = []
                      src = attrs_dict.get("src")
                      if src:
                          self.script_srcs.append(src)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self._in_script:
                      if self._script_type in ("", "text/javascript", "application/javascript", "module"):
                          self.scripts.append("\n".join(self._script_parts))
                      self._in_script = False
                      self._script_type = ""
                      self._script_parts = []

              def handle_data(self, data):
                  if self._in_script:
                      self._script_parts.append(data)

          def run(*args: str, check: bool = True) -> subprocess.CompletedProcess:
              return subprocess.run(args, text=True, capture_output=True, check=check)

          def git_text_at(ref: str, path: str) -> bytes:
              cp = subprocess.run(
                  ["git", "show", f"{ref}:{path}"],
                  capture_output=True,
                  check=True,
              )
              return cp.stdout

          def tracked_files_at(ref: str) -> list[str]:
              cp = run("git", "ls-tree", "-r", "--name-only", ref)
              return [line.strip() for line in cp.stdout.splitlines() if line.strip()]

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def yaml_scalar(value):
              if value is None:
                  return "null"
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, (int, float)):
                  return str(value)
              text = str(value)
              return json.dumps(text, ensure_ascii=False)

          def to_yaml(value, indent=0):
              pad = " " * indent
              lines = []
              if isinstance(value, dict):
                  for key, item in value.items():
                      if isinstance(item, (dict, list)):
                          lines.append(f"{pad}{key}:")
                          lines.extend(to_yaml(item, indent + 2))
                      else:
                          lines.append(f"{pad}{key}: {yaml_scalar(item)}")
              elif isinstance(value, list):
                  if not value:
                      lines.append(f"{pad}[]")
                  for item in value:
                      if isinstance(item, (dict, list)):
                          lines.append(f"{pad}-")
                          lines.extend(to_yaml(item, indent + 2))
                      else:
                          lines.append(f"{pad}- {yaml_scalar(item)}")
              else:
                  lines.append(f"{pad}{yaml_scalar(value)}")
              return lines

          now_utc = dt.datetime.now(dt.timezone.utc)
          jst = dt.timezone(dt.timedelta(hours=9))
          now_jst = now_utc.astimezone(jst)

          all_baseline_files = tracked_files_at(BASELINE_SHA)
          manifest_rows = []
          for path in all_baseline_files:
              data = git_text_at(BASELINE_SHA, path)
              manifest_rows.append(
                  {
                      "path": path,
                      "bytes": len(data),
                      "sha256": sha256(data),
                  }
              )

          manifest_lines = [
              "# DPRO 整骨院・整体 LINE / STEP SEITAI-NEXT-1",
              f"# baseline_sha={BASELINE_SHA}",
              f"# backup_tag={BACKUP_TAG}",
              "# sha256  bytes  path",
          ]
          for row in manifest_rows:
              manifest_lines.append(f'{row["sha256"]}  {row["bytes"]:>8}  {row["path"]}')
          MANIFEST_FILE.write_text("\n".join(manifest_lines) + "\n", encoding="utf-8")

          html_results = {}
          critical_errors = []
          warnings = []
          all_api_paths = set()
          public_admin_findings = []
          feature_source_parts = []

          for required in REQUIRED:
              if not Path(required).is_file():
                  critical_errors.append(f"missing_required_file:{required}")

          for html_path in sorted(ROOT.glob("*.html")):
              text = html_path.read_text(encoding="utf-8-sig")
              parser = Inspector()
              try:
                  parser.feed(text)
                  parser.close()
                  html_parse = "OK"
              except Exception as exc:
                  html_parse = "NG"
                  critical_errors.append(f"html_parse:{html_path}:{exc}")

              counts = collections.Counter(parser.ids)
              duplicates = sorted([item for item, count in counts.items() if count > 1])
              if duplicates:
                  critical_errors.append(f"duplicate_html_id:{html_path}:{','.join(duplicates)}")

              literal_refs = sorted(set(
                  re.findall(r'getElementById\(\s*["\']([^"\']+)["\']\s*\)', text)
                  + re.findall(r'\$\(\s*["\']([^"\']+)["\']\s*\)', text)
              ))
              missing_refs = sorted(set(literal_refs) - set(parser.ids))
              if missing_refs:
                  warnings.append(f"literal_id_reference_not_found:{html_path}:{','.join(missing_refs)}")

              js_checks = []
              for index, script in enumerate(parser.scripts, start=1):
                  if not script.strip():
                      continue
                  temp_path = None
                  try:
                      with tempfile.NamedTemporaryFile(
                          mode="w",
                          encoding="utf-8",
                          suffix=f"-{html_path.stem}-{index}.js",
                          delete=False,
                      ) as tmp:
                          tmp.write(script)
                          temp_path = tmp.name
                      cp = subprocess.run(
                          ["node", "--check", temp_path],
                          text=True,
                          capture_output=True,
                      )
                      item = {
                          "inline_script": index,
                          "status": "OK" if cp.returncode == 0 else "NG",
                          "detail": (cp.stderr or cp.stdout).strip()[:1200],
                      }
                      js_checks.append(item)
                      if cp.returncode != 0:
                          critical_errors.append(
                              f"javascript_syntax:{html_path}:inline_script_{index}"
                          )
                  finally:
                      if temp_path:
                          Path(temp_path).unlink(missing_ok=True)

              api_paths = sorted(set(re.findall(r'["\'](/api/[A-Za-z0-9_./?=&-]+)', text)))
              all_api_paths.update(api_paths)
              feature_source_parts.append(text)

              html_results[str(html_path)] = {
                  "html_parse": html_parse,
                  "id_count": len(parser.ids),
                  "duplicate_ids": duplicates,
                  "literal_id_reference_count": len(literal_refs),
                  "literal_id_references_not_found": missing_refs,
                  "inline_javascript": js_checks,
                  "external_scripts": parser.script_srcs,
                  "api_paths": api_paths,
                  "bytes": html_path.stat().st_size,
              }

          js_results = {}
          for js_path in sorted(ROOT.glob("*.js")):
              cp = subprocess.run(
                  ["node", "--check", str(js_path)],
                  text=True,
                  capture_output=True,
              )
              status = "OK" if cp.returncode == 0 else "NG"
              js_results[str(js_path)] = {
                  "status": status,
                  "detail": (cp.stderr or cp.stdout).strip()[:1200],
                  "bytes": js_path.stat().st_size,
              }
              if cp.returncode != 0:
                  critical_errors.append(f"javascript_syntax:{js_path}")
              text = js_path.read_text(encoding="utf-8-sig")
              all_api_paths.update(re.findall(r'["\'](/api/[A-Za-z0-9_./?=&-]+)', text))
              feature_source_parts.append(text)

          feature_source = "\n".join(feature_source_parts)

          core_features = {
              "customer_reservation": [
                  "/api/reservations/create",
                  "reservationCreate",
              ],
              "reservation_update": [
                  "/api/reservations/update",
                  "reservationUpdate",
              ],
              "reservation_cancel": [
                  "/api/reservations/cancel",
                  "reservationCancel",
              ],
              "owner_today": [
                  "/api/owner/today",
                  "ownerToday",
              ],
              "visit_check_in": [
                  "/api/owner/visits/check-in",
              ],
              "visit_start": [
                  "/api/owner/visits/start",
              ],
              "visit_complete": [
                  "/api/owner/visits/complete",
              ],
              "ticket_use": [
                  "/api/owner/tickets/use",
                  "ownerTicketsUse",
              ],
              "followup_management": [
                  "/api/owner/followups",
                  "ownerFollowups",
              ],
              "member_page": [
                  "/api/member/profile",
                  "memberProfile",
                  "会員証・予約確認",
              ],
              "manual_phone_walkin_reservation": [
                  "電話予約",
                  "店頭予約",
                  "manualSource",
              ],
              "admin_code_clear": [
                  "clearAdminCode",
                  "clearAdminBtn",
              ],
              "system_check": [
                  "/api/admin/safety-check",
                  "safetyCheck",
                  "system-check",
              ],
          }

          feature_checks = {}
          for key, markers in core_features.items():
              evidence = [marker for marker in markers if marker in feature_source]
              status = "OK" if evidence else "NG"
              feature_checks[key] = {
                  "status": status,
                  "evidence": evidence,
              }
              if status == "NG":
                  critical_errors.append(f"existing_feature_missing:{key}")

          public_files = ["index.html", "member.html", "config.js"]
          for path in public_files:
              p = Path(path)
              if not p.exists():
                  continue
              text = p.read_text(encoding="utf-8-sig")
              if re.search(r'ADMIN_TOKEN[^\n]{0,120}\b1234\b', text, flags=re.I):
                  public_admin_findings.append(
                      {
                          "file": path,
                          "severity": "ATTENTION",
                          "finding": "ADMIN_TOKENとデモ管理コード1234の説明が公開ファイル内コメントに存在",
                      }
                  )
              if re.search(r'(adminCode|admin_code)\s*[:=]\s*["\']1234["\']', text):
                  critical_errors.append(f"hardcoded_admin_code_runtime:{path}")

          if public_admin_findings:
              warnings.append("public_comment_contains_demo_admin_code_explanation")

          baseline_to_head = run(
              "git",
              "diff",
              "--name-only",
              f"{BASELINE_SHA}..HEAD",
              check=True,
          ).stdout.splitlines()

          app_changes = sorted(
              p for p in baseline_to_head
              if p != str(WORKFLOW_PATH) and p not in GENERATED
          )

          sql_files = sorted(str(p) for p in ROOT.rglob("*.sql") if ".git" not in p.parts)
          worker_candidates = sorted(
              str(p) for p in ROOT.rglob("*")
              if p.is_file() and p.name.lower() in {"worker.js", "worker.mjs", "worker.ts"}
          )

          worker_changed = any(
              Path(path).name.lower() in {"worker.js", "worker.mjs", "worker.ts"}
              for path in app_changes
          )
          supabase_changed = any(path.lower().endswith(".sql") for path in app_changes)
          api_changed = any(
              path in {"config.js", "worker.js", "worker.mjs", "worker.ts"}
              for path in app_changes
          )

          max_file = max(manifest_rows, key=lambda row: row["bytes"], default=None)
          size_warnings = [
              row for row in manifest_rows
              if row["bytes"] > 1_000_000
          ]
          if size_warnings:
              warnings.append("tracked_file_over_1mb")

          overall = "NG" if critical_errors else ("ATTENTION" if warnings else "OK")

          result = {
              "ok": not critical_errors,
              "overall": overall,
              "step": "SEITAI-NEXT-1",
              "checked_at_utc": now_utc.isoformat(),
              "checked_at_jst": now_jst.isoformat(),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "baseline_sha": BASELINE_SHA,
              "baseline_reason": BASELINE_REASON,
              "backup_tag": BACKUP_TAG,
              "backup_tag_status": TAG_STATUS,
              "required_files": REQUIRED,
              "html_checks": html_results,
              "javascript_file_checks": js_results,
              "existing_feature_checks": feature_checks,
              "api_paths_detected": sorted(all_api_paths),
              "public_management_information_findings": public_admin_findings,
              "file_count_at_baseline": len(manifest_rows),
              "largest_file_at_baseline": max_file,
              "files_over_1mb": size_warnings,
              "worker_source_files_in_repo": worker_candidates,
              "supabase_sql_files_in_repo": sql_files,
              "changes_from_baseline_to_workflow_upload": app_changes,
              "worker_changed": worker_changed,
              "supabase_changed": supabase_changed,
              "api_changed": api_changed,
              "screen_function_changed": bool(app_changes),
              "existing_data_changed": False,
              "critical_errors": critical_errors,
              "warnings": warnings,
          }
          RESULT_FILE.write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          baseline = {
              "schema_version": 1,
              "system_name": "DPRO 整骨院・整体 LINE",
              "step": "SEITAI-NEXT-1",
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "default_branch": os.environ.get("GITHUB_REF_NAME", "main"),
              "baseline_sha": BASELINE_SHA,
              "baseline_reason": BASELINE_REASON,
              "backup_tag": BACKUP_TAG,
              "captured_at_utc": now_utc.isoformat(),
              "captured_at_jst": now_jst.isoformat(),
              "files": manifest_rows,
              "api_paths": sorted(all_api_paths),
              "required_screens": REQUIRED,
              "worker_source_in_repository": bool(worker_candidates),
              "supabase_sql_in_repository": bool(sql_files),
          }
          BASELINE_FILE.write_text(
              json.dumps(baseline, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          ledger = {
              "system_name": "DPRO 整骨院・整体 LINE",
              "standard": "DPRO NEXT",
              "step_name": "正常版保護・現状基準台帳",
              "current_step": "SEITAI-NEXT-1-COMPLETE" if not critical_errors else "SEITAI-NEXT-1-FAILED",
              "previous_step": "NONE_INITIAL_BASELINE",
              "next_step": "SEITAI-NEXT-2" if not critical_errors else "SEITAI-NEXT-1-R2",
              "completed_at_jst": now_jst.strftime("%Y-%m-%d %H:%M:%S %z"),
              "baseline_sha": BASELINE_SHA,
              "backup_tag": BACKUP_TAG,
              "backup_tag_status": TAG_STATUS,
              "target_files": REQUIRED,
              "generated_files": [
                  str(LEDGER_FILE),
                  str(BASELINE_FILE),
                  str(MANIFEST_FILE),
                  str(RESULT_FILE),
              ],
              "checks": {
                  "required_files": "OK" if all(Path(p).is_file() for p in REQUIRED) else "NG",
                  "yml_syntax": "OK",
                  "html_syntax": "OK" if not any(e.startswith("html_parse:") for e in critical_errors) else "NG",
                  "javascript_syntax": "OK" if not any(e.startswith("javascript_syntax:") for e in critical_errors) else "NG",
                  "html_id_duplicates": "OK" if not any(e.startswith("duplicate_html_id:") for e in critical_errors) else "NG",
                  "existing_function_preservation": "OK" if not any(e.startswith("existing_feature_missing:") for e in critical_errors) else "NG",
                  "industry_logic": "OK" if not any(e.startswith("existing_feature_missing:") for e in critical_errors) else "NG",
                  "public_management_information": "ATTENTION" if public_admin_findings else "OK",
                  "overall": overall,
              },
              "change_record": {
                  "worker_changed": worker_changed,
                  "supabase_changed": supabase_changed,
                  "api_changed": api_changed,
                  "screen_function_changed": bool(app_changes),
                  "existing_data_changed": False,
              },
              "known_risks": [
                  "WorkerソースはこのGitHubリポジトリ内に存在しない可能性があるため、Worker内部ロジックは公開API応答とsystem-checkで別途確認する",
                  "config.jsの公開コメントにデモ管理コード1234の説明が残っているため、NEXT-2で除去する",
                  "会員ページの来院履歴詳細は現行画面上で未完成と記録されている",
                  "LIFF IDとLIFF URLは現行config.jsで未設定",
              ],
              "rollback": {
                  "method": "backup_tag",
                  "tag": BACKUP_TAG,
                  "command_reference": f"git checkout {BACKUP_TAG}",
              },
              "workflow_self_delete_after_success": True,
              "auto_commit_push": True,
          }
          LEDGER_FILE.write_text(
              "\n".join(to_yaml(ledger)) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(
              {
                  "overall": overall,
                  "critical_errors": critical_errors,
                  "warnings": warnings,
                  "generated": [
                      str(LEDGER_FILE),
                      str(BASELINE_FILE),
                      str(MANIFEST_FILE),
                      str(RESULT_FILE),
                  ],
              },
              ensure_ascii=False,
              indent=2,
          ))

          if critical_errors:
              sys.exit(2)
          PY

      - name: "6. 検査結果アーティファクト保存"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "seitai-next-1-baseline-results"
          if-no-files-found: warn
          retention-days: 30
          path: |
            dpro-next-ledger.yml
            dpro-next-baseline.json
            dpro-next-file-manifest.txt
            dpro-next-check-result.json

      - name: "7. STEP完了条件確認"
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RESULT_FILE"]).read_text(encoding="utf-8"))
          if not result.get("ok"):
              raise SystemExit("重大な検査エラーがあるため、STEPを完了できません。")

          if result.get("worker_changed"):
              raise SystemExit("NEXT-1でWorker変更が検出されました。")
          if result.get("supabase_changed"):
              raise SystemExit("NEXT-1でSupabase SQL変更が検出されました。")
          if result.get("api_changed"):
              raise SystemExit("NEXT-1でAPI変更が検出されました。")
          if result.get("screen_function_changed"):
              raise SystemExit("NEXT-1で既存画面・機能ファイル変更が検出されました。")

          print("STEP SEITAI-NEXT-1 completion conditions: OK")
          PY

      - name: "8. YML自身を削除・台帳を自動Commit/Push"
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f "$WORKFLOW_PATH"

          git add \
            "$LEDGER_FILE" \
            "$BASELINE_FILE" \
            "$MANIFEST_FILE" \
            "$RESULT_FILE" \
            "$WORKFLOW_PATH"

          if git diff --cached --quiet; then
            echo "Commit対象の変更はありません。"
          else
            git commit -m "chore(seitai-next): complete NEXT-1 baseline protection [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          {
            echo ""
            echo "### 完了"
            echo "- current_step: \`SEITAI-NEXT-1-COMPLETE\`"
            echo "- next_step: \`SEITAI-NEXT-2\`"
            echo "- Worker変更: \`false\`"
            echo "- Supabase変更: \`false\`"
            echo "- API変更: \`false\`"
            echo "- 既存画面機能変更: \`false\`"
            echo "- STEP YML: 成功後に削除"
          } >> "$GITHUB_STEP_SUMMARY"
