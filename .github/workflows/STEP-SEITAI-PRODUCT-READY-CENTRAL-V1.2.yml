name: STEP SEITAI PRODUCT READY CENTRAL V1.2 R2

on:
  push:
    branches: [main]
    paths: [".github/workflows/STEP-SEITAI-PRODUCT-READY-CENTRAL-V1.2.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seitai-product-ready-central-v1-2
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/STEP-SEITAI-PRODUCT-READY-CENTRAL-V1.2.yml
  BACKUP_TAG: backup-seitai-before-product-ready-central-20260822
  ADAPTER_BASE: https://cbknucemarcpbscirzyv.supabase.co/functions/v1/seitai-control-adapter
  EXPECTED_WORKER: STEP-SEITAI-NEXT-9-R1-PHONE-NFKC-20260724
  EXPECTED_DB: SEITAI-DB-RUNTIME-BASELINE-V1-20260822
  EXPECTED_FRONTEND: STEP-SEITAI-NEXT-10-COMPLETE-20260724

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout locked source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify baseline and create rollback tag
        shell: bash
        run: |
          set -euo pipefail
          test -f config.js
          test -f staff.html
          test -f system-check.html
          test -f dpro-next-ledger.yml
          grep -q 'STEP-SEITAI-NEXT-10-COMPLETE-20260724' config.js
          grep -q 'current_step: "SEITAI-NEXT-10-COMPLETE"' dpro-next-ledger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASELINE_SHA="9dbe7abc821eb45ee93d1525f41921f3ca98f260"
          git cat-file -e "$BASELINE_SHA^{commit}"
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
          UNEXPECTED="$(git diff --name-only "$BASELINE_SHA"..HEAD | grep -v '^.github/workflows/STEP-SEITAI-PRODUCT-READY-CENTRAL-V1.2.yml$' || true)"
          test -z "$UNEXPECTED" || { echo "Unexpected drift before Product READY:"; echo "$UNEXPECTED"; exit 1; }
          if git rev-parse "$BACKUP_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$BACKUP_TAG")" = "$BASELINE_SHA"
          else
            git tag -a "$BACKUP_TAG" "$BASELINE_SHA" -m "SEITAI before Product READY CENTRAL V1.2"
            git push origin "$BACKUP_TAG"
          fi

      - name: Add staff scoped bridge and system-check Product READY card
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          adapter="https://cbknucemarcpbscirzyv.supabase.co/functions/v1/seitai-control-adapter"

          staff_js=r'''(() => {
            "use strict";
            const ADAPTER = "https://cbknucemarcpbscirzyv.supabase.co/functions/v1/seitai-control-adapter";
            const SESSION_KEY = "DPRO_SEITAI_STAFF_READY_SESSION";
            const nativeFetch = window.fetch.bind(window);
            let sessionPromise = null;
            const oldBase = String(window.DPRO_SEITAI_CONFIG?.apiBaseUrl || "https://dpro-seitai-line-api.dpromstk2000.workers.dev").replace(/\/+$/, "");
            function selectedStaff(){ return document.getElementById("staffSelect")?.value || ""; }
            function accessCode(){ try{return localStorage.getItem(window.DPRO_SEITAI_CONFIG?.adminCodeStorageKey || "DPRO_SEITAI_ADMIN_CODE") || ""}catch{return ""} }
            function shopCode(){ return window.DPRO_SEITAI_CONFIG?.shopCode || "dpro_seitai_demo"; }
            function loadSession(){ try{const x=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null"); if(x?.token && x?.staff_code===selectedStaff()) return x}catch{} return null }
            function saveSession(x){ try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(x))}catch{} }
            async function ensureSession(){
              const cached=loadSession(); if(cached) return cached;
              const staff=selectedStaff(), code=accessCode();
              if(!staff) throw new Error("スタッフを選択してください。");
              if(!code) throw new Error("スタッフアクセスコードを保存してください。");
              if(sessionPromise) return sessionPromise;
              sessionPromise=(async()=>{
                const r=await nativeFetch(`${ADAPTER}/staff/session`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({shop_code:shopCode(),staff_code:staff,access_code:code})});
                const d=await r.json().catch(()=>({}));
                if(!r.ok||d.ok===false||!d.token) throw new Error(d.error||"スタッフ認証に失敗しました。");
                const x={token:d.token,staff_code:staff,session:d.session}; saveSession(x); return x;
              })();
              try{return await sessionPromise}finally{sessionPromise=null}
            }
            function response(body,status=200){return new Response(JSON.stringify(body),{status,headers:{"Content-Type":"application/json"}})}
            window.fetch=async function(input,init={}){
              const url=new URL(typeof input==="string"?input:input.url,location.href);
              if(url.origin===new URL(oldBase).origin && url.pathname==="/api/owner/today"){
                try{const s=await ensureSession(); const q=new URLSearchParams(); if(url.searchParams.get("date"))q.set("date",url.searchParams.get("date")); const r=await nativeFetch(`${ADAPTER}/staff/today?${q}`,{headers:{Authorization:`Bearer ${s.token}`}}); return r}catch(e){return response({ok:false,error:e.message},403)}
              }
              if(url.origin===new URL(oldBase).origin && ["/api/owner/visits/start","/api/owner/visits/complete"].includes(url.pathname)){
                try{const s=await ensureSession(); const raw=typeof init.body==="string"?JSON.parse(init.body||"{}"):{}; const action=url.pathname.endsWith("/start")?"start":"complete"; return nativeFetch(`${ADAPTER}/staff/action`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${s.token}`},body:JSON.stringify({action,reservation_id:raw.reservation_id})})}catch(e){return response({ok:false,error:e.message},403)}
              }
              return nativeFetch(input,init);
            };
            function relabel(){
              const input=document.getElementById("adminCodeInput");
              const label=input?.closest("div")?.querySelector('label[for="adminCodeInput"]'); if(label)label.textContent="スタッフアクセスコード";
              const all=document.querySelector('#staffSelect option[value=""]'); if(all)all.textContent="スタッフを選択";
              document.getElementById("staffSelect")?.addEventListener("change",()=>{try{sessionStorage.removeItem(SESSION_KEY)}catch{}});
            }
            if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",relabel);else relabel();
          })();'''

          check_js=r'''(() => {
            "use strict";
            const ADAPTER="https://cbknucemarcpbscirzyv.supabase.co/functions/v1/seitai-control-adapter";
            function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
            async function get(path){const r=await fetch(`${ADAPTER}${path}`,{cache:"no-store"});const d=await r.json().catch(()=>({}));return {status:r.status,data:d}}
            function mount(){
              const grid=document.querySelector("main .grid"); if(!grid||document.getElementById("productReadyCentralCard"))return;
              const card=document.createElement("div"); card.className="card span12"; card.id="productReadyCentralCard";
              card.innerHTML=`<h2>PRODUCT READY / CENTRAL V1.2</h2><p class="note">Worker・Database・Frontendの独立Version整合、LINE本人確認能力、スタッフ権限境界を読取専用で確認します。</p><div class="row" style="margin-top:12px"><button class="btn primary" id="productReadyCentralRun" type="button">PRODUCT READY確認</button><span class="status" id="productReadyCentralStatus">未確認</span></div><div class="jsonBox" id="productReadyCentralJson" style="margin-top:12px;min-height:160px">{}</div>`;
              grid.prepend(card);
              document.getElementById("productReadyCentralRun").addEventListener("click",run);
              run().catch(()=>{});
            }
            async function run(){
              const st=document.getElementById("productReadyCentralStatus"), box=document.getElementById("productReadyCentralJson"); st.textContent="確認中...";st.className="status warn";
              try{const [h,l,s]=await Promise.all([get("/health"),get("/line/capability"),get("/staff/capability")]); const ok=h.status===200&&h.data.ok===true&&h.data.versionsAligned===true&&l.status===200&&l.data.ok===true&&l.data.clientSuppliedIdentityAccepted===false&&s.status===200&&s.data.ok===true&&s.data.ownerMutationAuthority===false; const out={ok,health:h,line:l,staff:s};box.textContent=JSON.stringify(out,null,2);st.textContent=ok?"PRODUCT READY基盤 OK":"要確認";st.className=`status ${ok?"ok":"ng"}`;}catch(e){box.textContent=JSON.stringify({ok:false,error:e.message},null,2);st.textContent="要確認";st.className="status ng"}
            }
            if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",mount);else mount();
          })();'''

          Path("staff-ready-bridge.js").write_text(staff_js+"\n",encoding="utf-8")
          Path("system-check-product-ready-addon.js").write_text(check_js+"\n",encoding="utf-8")

          def wire(path, tag):
              p=Path(path); t=p.read_text(encoding="utf-8")
              if tag not in t:
                  if "</body>" not in t: raise SystemExit(f"missing </body>: {path}")
                  t=t.replace("</body>",f"  {tag}\n</body>",1)
                  p.write_text(t,encoding="utf-8")
          wire("staff.html",'<script src="./staff-ready-bridge.js?v=product-ready-central-v12"></script>')
          wire("system-check.html",'<script src="./system-check-product-ready-addon.js?v=product-ready-central-v12"></script>')
          PY
          node --check staff-ready-bridge.js
          node --check system-check-product-ready-addon.js
          grep -q 'staff-ready-bridge.js' staff.html
          grep -q 'system-check-product-ready-addon.js' system-check.html

      - name: Live verify SEITAI Control Adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/seitai-product-ready-central-v1.2
          python3 <<'PY'
          import json,os,urllib.request,urllib.error,datetime
          base=os.environ["ADAPTER_BASE"].rstrip("/")
          def call(path,method="GET",body=None,headers=None,accept=(200,)):
              data=None if body is None else json.dumps(body).encode()
              h={"Accept":"application/json","User-Agent":"SEITAI-PRODUCT-READY-CENTRAL-V1.2",**(headers or {})}
              if body is not None:h["Content-Type"]="application/json"
              req=urllib.request.Request(base+path,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: status=r.status; obj=json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  status=e.code; obj=json.loads(e.read().decode() or "{}")
              if status not in accept: raise SystemExit(f"{path} HTTP {status}: {obj}")
              return status,obj
          _,health=call("/health")
          if not (health.get("ok") is True and health.get("versionsAligned") is True): raise SystemExit(f"health/alignment NG: {health}")
          if health.get("adapterVersion") != "DPRO-CONTROL-ADAPTER-1.0-SEITAI-20260822-R2": raise SystemExit(f"adapter version NG: {health.get('adapterVersion')}")
          cur=health.get("current",{}); exp=health.get("expected",{})
          for key,envkey in [("workerVersion","EXPECTED_WORKER"),("databaseVersion","EXPECTED_DB"),("frontendVersion","EXPECTED_FRONTEND")]:
              if cur.get(key)!=os.environ[envkey] or exp.get(key)!=os.environ[envkey]: raise SystemExit(f"version mismatch {key}: {cur.get(key)} / {exp.get(key)}")
          _,line=call("/line/capability")
          if not(line.get("ok") is True and line.get("clientSuppliedIdentityAccepted") is False): raise SystemExit(f"line capability NG: {line}")
          allowed_status,_=call("/line/capability",headers={"Origin":"https://dpromstk2000-lab.github.io"})
          if allowed_status != 200: raise SystemExit(f"allowed origin NG: {allowed_status}")
          blocked_status,_=call("/line/capability",headers={"Origin":"https://evil.example"},accept=(403,))
          if blocked_status != 403: raise SystemExit(f"unknown origin was not rejected: {blocked_status}")
          status,line_no_token=call("/line/verify",method="POST",body={"phone":"09011112222","customer_no":"demo"},accept=(400,409))
          if status==200: raise SystemExit("LINE unsafe client identity was accepted")
          _,staff=call("/staff/capability")
          if not(staff.get("ok") is True and staff.get("ownerMutationAuthority") is False): raise SystemExit(f"staff capability NG: {staff}")
          _,sess=call("/staff/session",method="POST",body={"shop_code":"dpro_seitai_demo","staff_code":"staff_a","access_code":"1234"})
          token=sess.get("token");
          if not token: raise SystemExit("demo staff session token missing")
          today=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date().isoformat()
          _,today_data=call(f"/staff/today?date={today}",headers={"Authorization":f"Bearer {token}"})
          if today_data.get("ok") is not True or today_data.get("ownerMutationAuthority") is not False: raise SystemExit(f"staff scoped read NG: {today_data}")
          result={"ok":True,"health":health,"line":line,"line_unsafe_identity_status":status,"staff":staff,"staff_demo_read":{"ok":today_data.get("ok"),"role":today_data.get("role"),"readScope":today_data.get("readScope"),"ownerMutationAuthority":today_data.get("ownerMutationAuthority")}}
          open("qa/seitai-product-ready-central-v1.2/runtime-adapter.json","w",encoding="utf-8").write(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Post-patch browser QA PC / 390 / 320 / iPad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seitai-browser qa/seitai-product-ready-central-v1.2/screens
          cd /tmp/seitai-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 >/tmp/seitai-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > /tmp/seitai-browser/qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const out=process.env.GITHUB_WORKSPACE+'/qa/seitai-product-ready-central-v1.2/screens';
          const base='http://127.0.0.1:4173';
          const cases=[
            ['pc-owner','owner.html',1440,1000],
            ['customer-390','index.html',390,844],
            ['customer-320','index.html',320,720],
            ['member-390','member.html',390,844],
            ['member-320','member.html',320,720],
            ['ipad','owner-ipad.html',1024,768],
            ['staff-mobile','staff.html',390,844],
            ['system-check','system-check.html',1200,900],
          ];
          const results=[];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [key,file,width,height] of cases){
              const page=await browser.newPage({viewport:{width,height}}); const errors=[];
              page.on('pageerror',e=>errors.push('pageerror:'+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
              await page.route('**/*',async route=>{
                const u=route.request().url();
                if(u.includes('workers.dev')||u.includes('supabase.co/functions/v1/')){
                  let body={
                    ok:true,
                    reservations:[],customers:[],visits:[],tickets:[],followups:[],
                    templates:[],messages:[],staff:[],menus:[],resources:[],
                    hours:[],special_days:[],settings:{reservation_slot_minutes:30}
                  };
                  if(u.includes('/public/settings')){
                    body={...body,shop:{shop_name:'DPRO整体院'},staff:[{id:'s1',staff_code:'staff_a',staff_name:'佐藤先生',display_name:'佐藤先生',role:'staff',is_active:true}],menus:[{id:'m1',menu_code:'regular_seitai',menu_name:'整体',duration_minutes:60,is_active:true}]};
                  }else if(u.includes('/seitai-control-adapter/health')){
                    body={ok:true,versionsAligned:true,adapterVersion:'DPRO-CONTROL-ADAPTER-1.0-SEITAI-20260822-R2',current:{workerVersion:'STEP-SEITAI-NEXT-9-R1-PHONE-NFKC-20260724',databaseVersion:'SEITAI-DB-RUNTIME-BASELINE-V1-20260822',frontendVersion:'STEP-SEITAI-NEXT-10-COMPLETE-20260724'}};
                  }else if(u.includes('/seitai-control-adapter/line/capability')){
                    body={ok:true,clientSuppliedIdentityAccepted:false,capability:'server_verified_line_identity'};
                  }else if(u.includes('/seitai-control-adapter/staff/capability')){
                    body={ok:true,ownerMutationAuthority:false,capability:'server_scoped_staff_session'};
                  }
                  return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
                }
                return route.continue();
              });
              await page.goto(`${base}/${file}`,{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(700);
              const metrics=await page.evaluate(()=>{
                const visible=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'};
                const selector=e=>{
                  if(e.id)return '#'+e.id;
                  const cls=[...e.classList].slice(0,3).join('.');
                  return e.tagName.toLowerCase()+(cls?'.'+cls:'');
                };
                const els=[...document.querySelectorAll('body *')].filter(visible);
                const overflowing=els.map(e=>{const r=e.getBoundingClientRect();return {selector:selector(e),text:(e.textContent||'').trim().replace(/\s+/g,' ').slice(0,60),left:r.left,right:r.right,width:r.width}})
                  .filter(x=>x.left<-2||x.right>window.innerWidth+2||x.width>window.innerWidth+2)
                  .slice(0,20);
                return {
                  innerWidth:window.innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  bodyScrollWidth:document.body.scrollWidth,
                  visibleButtons:[...document.querySelectorAll('button,a.btn')].filter(visible).slice(0,80).map(e=>{const r=e.getBoundingClientRect();return {text:(e.textContent||'').trim().slice(0,40),left:r.left,right:r.right,width:r.width,height:r.height}}),
                  overflowing
                };
              });
              const clipped=metrics.visibleButtons.filter(b=>b.left<-2||b.right>width+2||b.width<1);
              const pageErrors=errors.filter(x=>x.startsWith('pageerror:'));
              const consoleErrors=errors.filter(x=>x.startsWith('console:')&&!x.includes('favicon'));
              const blockingConsoleErrors=consoleErrors.filter(x=>/Uncaught|TypeError|ReferenceError|SyntaxError/i.test(x));
              const ok=metrics.scrollWidth<=width+2&&metrics.bodyScrollWidth<=width+2&&clipped.length===0&&pageErrors.length===0&&blockingConsoleErrors.length===0;
              await page.screenshot({path:`${out}/${key}.png`,fullPage:true});
              results.push({key,file,viewport:[width,height],ok,metrics,clipped,pageErrors,blockingConsoleErrors,consoleErrors}); await page.close();
            }
            await browser.close();
            const allOk=results.every(x=>x.ok);
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa/seitai-product-ready-central-v1.2/browser.json',JSON.stringify({ok:allOk,results},null,2)+'\n');
            for(const x of results){
              const m=x.metrics||{};
              console.log(`QA_CASE=${x.key} OK=${x.ok} FILE=${x.file} VIEWPORT=${x.viewport.join('x')} HTML=${m.scrollWidth} BODY=${m.bodyScrollWidth} CLIPPED=${x.clipped.length} PAGE_ERRORS=${x.pageErrors.length} BLOCKING_CONSOLE=${x.blockingConsoleErrors.length} OVERFLOW_ELEMENTS=${(m.overflowing||[]).length}`);
              if(!x.ok){
                console.error(`FAIL_CASE=${x.key} FILE=${x.file} VIEWPORT=${x.viewport.join('x')} HTML=${m.scrollWidth} BODY=${m.bodyScrollWidth}`);
                console.error('FAIL_CLIPPED='+JSON.stringify(x.clipped));
                console.error('FAIL_PAGE_ERRORS='+JSON.stringify(x.pageErrors));
                console.error('FAIL_BLOCKING_CONSOLE='+JSON.stringify(x.blockingConsoleErrors));
                console.error('FAIL_OVERFLOW_ELEMENTS='+JSON.stringify(m.overflowing||[]));
              }
            }
            if(!allOk)process.exit(1)
          })();
          JS
          node /tmp/seitai-browser/qa.js

      - name: Write Product READY adapter manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > dpro-product-ready-adapter.json <<'JSON'
          {
            "systemCode": "SEITAI",
            "standard": "DPRO-CONTROL-ADAPTER-1.0",
            "adapterVersion": "DPRO-CONTROL-ADAPTER-1.0-SEITAI-20260822-R2",
            "adapterUrl": "https://cbknucemarcpbscirzyv.supabase.co/functions/v1/seitai-control-adapter",
            "databaseBaseline": "SEITAI-DB-RUNTIME-BASELINE-V1-20260822",
            "lineIdentity": "server_verified_id_token",
            "lineCustomerBinding": "deferred_until_contract",
            "staffBoundary": "server_scoped_signed_session",
            "staffOwnerMutationAuthority": false,
            "staffCustomerBinding": "deferred_until_contract",
            "centralPolicy": "PRECONTRACT_CAPABILITY_CUSTOMER_BINDING_DEFERRED"
          }
          JSON

      - name: Commit verified post-patch source and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$WORKFLOW_FILE"
          git add staff.html system-check.html staff-ready-bridge.js system-check-product-ready-addon.js dpro-product-ready-adapter.json qa/seitai-product-ready-central-v1.2 "$WORKFLOW_FILE"
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "SEITAI Product READY CENTRAL V1.2 R2 apply and QA [skip ci]"
          git push origin HEAD:main
