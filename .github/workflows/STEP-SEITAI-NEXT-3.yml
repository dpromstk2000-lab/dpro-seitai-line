          <div class="itemMeta">
            フォロー対象：${followups.length}件<br>
            症状・部位タグ：${escapeHtml(concernTags.slice(0, 6).join(" / ") || "-")}<br>
            次回予約：${escapeHtml(reservations.find((row) => ["reserved", "arrived", "in_treatment"].includes(row.status))?.reservation_date || "未予約")}
          </div>
