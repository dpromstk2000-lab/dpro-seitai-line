            </div>
            ${latest.request_note ? `<div class="alert" style="margin-top:10px;">前回メモ：${escapeHtml(latest.request_note)}</div>` : ""}
          ` : `<div class="empty">予約・来院履歴はありません。</div>`}
                  </div>
                  <div class="patientSummaryBox">
          <h3>回数券</h3>
          ${activeTickets.length ? activeTickets.map((ticket) => `
            <div class="patientHistoryRow" style="margin-top:8px;">
