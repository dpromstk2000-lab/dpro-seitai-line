              '<button class="btn dark small" data-followup-action="done" data-id="${escapeHtml(f.followup_id || f.id)}">対応済み</button>\n          <button class="btn ghost small" data-followup-action="history" data-id="${escapeHtml(f.followup_id || f.id)}">患者履歴</button>',
