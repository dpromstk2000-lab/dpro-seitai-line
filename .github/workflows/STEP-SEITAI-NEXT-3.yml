            all_images_initial_load: false
          rollback:
            method: "backup_tag"
            tag: "$BACKUP_TAG"
            command_reference: "git checkout $BACKUP_TAG"
          workflow_self_delete_after_success: true
          auto_commit_push: true
          EOF

          sed -i 's/^          //' dpro-next-ledger.yml

      - name: Commit, remove successful workflow and push
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$WORKFLOW_FILE"
          git add owner.html config.js dpro-next-ledger.yml dpro-next-check-result.json "$WORKFLOW_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi

          git commit -m "STEP SEITAI-NEXT-3 COMPLETE"
          git push origin HEAD:main
