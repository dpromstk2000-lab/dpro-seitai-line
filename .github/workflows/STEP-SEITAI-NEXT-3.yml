      - name: Validate syntax, IDs, API preservation and performance policy
        shell: bash
        run: |
          set -euo pipefail

          ruby -e 'require "yaml"; YAML.load_file(ENV.fetch("WORKFLOW_FILE")); puts "YML OK"'
          node --check config.js
          git diff --check

          python3 <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          import re
          import subprocess
          import tempfile

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.scripts = []
                  self.in_script = False
                  self.script_src = None
                  self.buffer = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag.lower() == "script":
                      self.in_script = True
                      self.script_src = attrs.get("src")
                      self.buffer = []
              def handle_data(self, data):
                  if self.in_script and not self.script_src:
                      self.buffer.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.script_src:
                          self.scripts.append("".join(self.buffer))
                      self.in_script = False
                      self.script_src = None
                      self.buffer = []

          owner = Path("owner.html").read_text(encoding="utf-8")
          config = Path("config.js").read_text(encoding="utf-8")
          before_owner = Path("/tmp/owner.before.html").read_text(encoding="utf-8")
          before_config = Path("/tmp/config.before.js").read_text(encoding="utf-8")
          system_check = Path("system-check.html").read_text(encoding="utf-8")
          before_system_check = Path("/tmp/system-check.before.html").read_text(encoding="utf-8")

          inspector = Inspector()
          inspector.feed(owner)
          duplicates = sorted({item for item in inspector.ids if inspector.ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f"Duplicate HTML IDs: {duplicates}")

          required_ids = {
              "patientLedgerSection", "patientSearchInput", "patientSearchBtn", "patientRecentBtn",
              "patientSearchStatus", "patientSearchResults", "patientHistoryDrawer", "patientHistoryName",
              "patientHistoryMeta", "patientHistoryTabs", "patientHistoryContent", "patientReserveBtn",
              "closePatientHistoryBtn", "patientHistoryCloseBottomBtn", "patientHistoryStatus"
          }
          missing_ids = sorted(required_ids - set(inspector.ids))
          if missing_ids:
              raise SystemExit(f"Missing NEXT-3 IDs: {missing_ids}")

          for index, script in enumerate(inspector.scripts, start=1):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as fh:
                  fh.write(script)
                  path = fh.name
              result = subprocess.run(["node", "--check", path], text=True, capture_output=True)
              if result.returncode != 0:
                  raise SystemExit(f"owner.html inline JavaScript {index} NG\n{result.stderr}")

          literal_refs = set(re.findall(r'\$\(["\']([^"\']+)["\']\)', owner))
          missing_refs = sorted(literal_refs - set(inspector.ids))
          if missing_refs:
              raise SystemExit(f"JavaScript literal ID references not found: {missing_refs}")

          required_markers = [
              "STEP SEITAI-NEXT-3 / owner.html",
              "patient history is loaded only when selected",
              "function searchPatients",
              "function loadPatientHistory",
              "function renderPatientHistory",
              "function useSelectedPatientForReservation",
              'ownerCustomerSearch: "/api/owner/customers/search"',
              'ownerCustomerDetail: "/api/owner/customers/detail"',
              'data-action="history"',
              'data-followup-action="history"'
          ]
          for marker in required_markers:
              if marker not in owner and marker not in config:
                  raise SystemExit(f"Required marker missing: {marker}")

          existing_features = [
              "/api/reservations/create",
              "/api/reservations/update",
              "/api/reservations/cancel",
              "/api/owner/today",
              "/api/owner/visits/check-in",
              "/api/owner/visits/start",
              "/api/owner/visits/complete",
              "/api/owner/tickets/use",
              "/api/owner/followups",
              "/api/owner/reservations/manual-create",
              "clearAdminCode",
              "電話予約",
              "店頭予約"
          ]
          combined = owner + config + Path("index.html").read_text(encoding="utf-8") + Path("member.html").read_text(encoding="utf-8")
          for marker in existing_features:
              if marker not in combined:
                  raise SystemExit(f"Existing feature marker missing: {marker}")

          api_pattern = re.compile(r'/api/[A-Za-z0-9_./-]+')
          before_apis = set(api_pattern.findall(before_owner + before_config + before_system_check))
          after_apis = set(api_pattern.findall(owner + config + system_check))
          if before_apis != after_apis:
              raise SystemExit(f"API path set changed. added={sorted(after_apis-before_apis)} removed={sorted(before_apis-after_apis)}")

          if "searchPatients(\"\")" in re.search(r'async function init\(\) \{.*?\n  \}', owner, re.S).group(0):
              raise SystemExit("Patient history must not load during initial page initialization")

          if len(owner.encode("utf-8")) > 210000:
              raise SystemExit("owner.html exceeds the NEXT-3 size guard of 210 KB")

          public_text = "\n".join(Path(name).read_text(encoding="utf-8") for name in ["owner.html", "config.js", "system-check.html"])
          forbidden = ["今回は <b>1234</b>", 'placeholder="例：1234"', "ADMIN_TOKEN は 1234"]
          for item in forbidden:
              if item in public_text:
                  raise SystemExit(f"Public management information remained: {item}")

          result = {
              "ok": True,
              "overall": "OK",
              "step": "SEITAI-NEXT-3",
              "checks": {
                  "previous_step": "OK",
                  "backup_tag": "OK",
                  "yml_syntax": "OK",
                  "html_syntax": "OK",
                  "javascript_syntax": "OK",
                  "html_id_duplicates": "OK",
                  "javascript_id_references": "OK",
                  "existing_function_preservation": "OK",
                  "patient_search": "OK",
                  "patient_detail_on_demand": "OK",
                  "reservation_visit_history": "OK",
                  "ticket_history": "OK",
                  "followup_history_or_current_target": "OK",
                  "previous_content_reuse": "OK",
                  "public_management_information": "OK",
                  "api_unchanged": "OK",
                  "worker_unchanged": "OK",
                  "supabase_unchanged": "OK",
                  "initial_load_policy": "OK",
                  "file_size": "OK"
              },
              "metrics": {
                  "owner_html_bytes": len(owner.encode("utf-8")),
                  "owner_html_id_count": len(inspector.ids),
                  "owner_html_inline_script_count": len(inspector.scripts),
                  "api_path_count": len(after_apis)
              },
              "performance_policy": {
                  "patient_history_initial_load": False,
                  "patient_detail_load_trigger": "patient_selection_only",
                  "search_result_limit": 20,
                  "history_render_limit": 40,
                  "all_images_initial_load": False
              },
              "change_record": {
                  "worker_changed": False,
                  "supabase_changed": False,
                  "api_changed": False,
                  "screen_function_changed": True,
                  "existing_data_changed": False
              }
          }
          Path("/tmp/seitai-next-3-check.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

