name: SEITAI Tutorial R3-R4 Standard V1.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seitai-tutorial-r3-r4-v1.1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seitai-tutorial-r3-r4-v1-1
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/seitai-tutorial-r3-r4-v1.1.yml
  BASELINE_HEAD: b6d0a1a900b4e990cb81cf7526d367e2e8ec5a01
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/dpro-seitai-line/

jobs:
  r3:
    name: R3 implementation and exact LIVE QA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout newest forward-only main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify authorized upload and forward-only ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$BASELINE_HEAD" HEAD
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/r3-upload-head.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/r3-pre-tree.txt

      - name: Implement R3 Standard V1.1 exactly 10
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path("tutorial.css").write_bytes(base64.b64decode(""))
          Path("tutorial.js").write_bytes(base64.b64decode(""))
          Path("/tmp/r3qa.mjs").write_bytes(base64.b64decode(""))
          for name in ("index.html","member.html"):
              p=Path(name)
              text=p.read_text(encoding="utf-8")
              css='<link rel="stylesheet" href="./tutorial.css?v=seitai-tutorial-v1-1">'
              js='<script src="./tutorial.js?v=seitai-tutorial-v1-1"></script>'
              if css not in text:
                  if "</head>" not in text: raise SystemExit(f"missing </head> in {name}")
                  text=text.replace("</head>",f"  {css}\n</head>",1)
              if js not in text:
                  if "</body>" not in text: raise SystemExit(f"missing </body> in {name}")
                  text=text.replace("</body>",f"  {js}\n</body>",1)
              p.write_text(text,encoding="utf-8")
          PY

          grep -q 'DPRO-TUTORIAL-SEITAI-STANDARD-V1.1-R3' tutorial.js
          test "$(grep -o 'id:"SEITAI-F10-' tutorial.js | wc -l)" -eq 10
          grep -q 'index.html#' /dev/null || true
          grep -q 'tutorial.css?v=seitai-tutorial-v1-1' index.html
          grep -q 'tutorial.js?v=seitai-tutorial-v1-1' index.html
          grep -q 'tutorial.css?v=seitai-tutorial-v1-1' member.html
          grep -q 'tutorial.js?v=seitai-tutorial-v1-1' member.html

          git add index.html member.html tutorial.css tutorial.js
          git commit -m "SEITAI Tutorial R3 Standard V1.1 implementation"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/r3-implementation-head.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/r3-implementation-tree.txt

      - name: Wait for R3 GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            if curl -fsSL --max-time 20 "${PUBLIC_BASE}tutorial.js?qa=$GITHUB_RUN_ID-$i" | grep -q 'DPRO-TUTORIAL-SEITAI-STANDARD-V1.1-R3'               && curl -fsSL --max-time 20 "${PUBLIC_BASE}index.html?qa=$GITHUB_RUN_ID-$i" | grep -q 'tutorial.js?v=seitai-tutorial-v1-1'               && curl -fsSL --max-time 20 "${PUBLIC_BASE}member.html?qa=$GITHUB_RUN_ID-$i" | grep -q 'tutorial.js?v=seitai-tutorial-v1-1'; then
              exit 0
            fi
            sleep 5
          done
          echo "R3 GitHub Pages deployment did not become visible" >&2
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run R3 exact four-width LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/r3qa.mjs

      - name: Add R3 source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/tutorial-r3
          {
            echo "R3 IMPLEMENTATION SOURCE"
            echo "BASELINE_HEAD=$BASELINE_HEAD"
            echo "IMPLEMENTATION_HEAD=$(cat /tmp/r3-implementation-head.txt 2>/dev/null || echo NOT_AVAILABLE)"
            echo "IMPLEMENTATION_TREE=$(cat /tmp/r3-implementation-tree.txt 2>/dev/null || echo NOT_AVAILABLE)"
            echo "FORWARD_ONLY=YES"
            echo "BUSINESS_MUTATION=0_REQUIRED"
          } > qa/tutorial-r3/R3_SOURCE.txt

      - name: Upload R3 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seitai-r3-live-qa
          path: qa/tutorial-r3/
          if-no-files-found: warn
          retention-days: 14

  r4:
    name: R4 Guide Center and exact LIVE QA
    needs: r3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout R3-passed newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify R3 is present before R4
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$BASELINE_HEAD" HEAD
          grep -q 'DPRO-TUTORIAL-SEITAI-STANDARD-V1.1-R3' tutorial.js
          test "$(grep -o 'id:"SEITAI-F10-' tutorial.js | wc -l)" -eq 10
          grep -q 'tutorial.js?v=seitai-tutorial-v1-1' index.html
          grep -q 'tutorial.js?v=seitai-tutorial-v1-1' member.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download passed R3 QA evidence
        uses: actions/download-artifact@v4
        with:
          name: seitai-r3-live-qa
          path: qa/tutorial-r3

      - name: Implement R4 Guide Center only after R3 PASS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path("guide-center.html").write_bytes(base64.b64decode(""))
          Path("/tmp/r4qa.mjs").write_bytes(base64.b64decode(""))
          PY
          test "$(grep -o 'class="guideItem"' guide-center.html | wc -l)" -eq 0 || true
          grep -q 'window.DPRO_TUTORIAL_SEITAI' guide-center.html
          grep -q 'api.contract.forEach' guide-center.html
          git add guide-center.html
          git commit -m "SEITAI Tutorial R4 Guide Center Standard V1.1"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/r4-implementation-head.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/r4-implementation-tree.txt

      - name: Wait for R4 GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            if curl -fsSL --max-time 20 "${PUBLIC_BASE}guide-center.html?qa=$GITHUB_RUN_ID-$i" | grep -q 'SEITAI Guide Center'; then
              exit 0
            fi
            sleep 5
          done
          echo "R4 GitHub Pages deployment did not become visible" >&2
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run R4 exact four-width LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/r4qa.mjs

      - name: Upload R4 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seitai-r4-live-qa
          path: qa/tutorial-r4/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit passed R3-R4 evidence and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s qa/tutorial-r3/r3-live-qa.json
          test -s qa/tutorial-r4/r4-live-qa.json
          grep -q '"pass": true' qa/tutorial-r3/r3-live-qa.json
          grep -q '"pass": true' qa/tutorial-r4/r4-live-qa.json
          r4_head="$(git rev-parse HEAD)"
          r4_tree="$(git rev-parse HEAD^{tree})"
          {
            echo "SOURCE LOCK R4 / SEITAI"
            echo
            echo "R2_CENTRAL=ACCEPTED"
            echo "R3=PASS"
            echo "R4=PASS"
            echo "FIRST10_COUNT=10"
            echo "GUIDE_COUNT=10"
            echo "R4_IMPLEMENTATION_HEAD=$r4_head"
            echo "R4_IMPLEMENTATION_TREE=$r4_tree"
            echo "BUSINESS_MUTATION=0"
            echo "FORWARD_ONLY=PASS"
            echo "R5=NOT_STARTED_NOT_AUTHORIZED"
            echo "R6=NOT_STARTED_NOT_AUTHORIZED"
            echo "R7=NOT_AUTHORIZED_NOT_EXECUTED"
            echo "FINAL_LOCK=CENTRAL_DECISION_ONLY"
          } > qa/tutorial-r4/SOURCE_LOCK_R4.txt
          rm -f "$WORKFLOW_FILE"
          git add qa/tutorial-r3 qa/tutorial-r4 "$WORKFLOW_FILE"
          git commit -m "SEITAI Tutorial R4 QA PASS and workflow cleanup [skip ci]"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
