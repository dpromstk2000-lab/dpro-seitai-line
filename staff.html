<html lang="ja">
<head>

  <script src="./config.js?v=seitai-next-10-complete"></script>
  <style>
    :root{--bg:#f3f7fb;--card:#fff;--ink:#102033;--muted:#64748b;--line:#dbe4ef;--brand:#0f766e;--brand2:#14a085;--ok:#16a34a;--warn:#f59e0b;--danger:#dc2626;--dark:#0f172a;--shadow:0 14px 38px rgba(15,23,42,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:radial-gradient(circle at top left,rgba(20,160,133,.14),transparent 320px),var(--bg);touch-action:manipulation}
    button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(760px,100%);margin:0 auto;padding:0 14px}header{padding:14px 0 8px}.hero{border:1px solid rgba(219,228,239,.96);border-radius:24px;background:rgba(255,255,255,.94);box-shadow:var(--shadow);padding:18px}.badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#e9fbf6;color:var(--brand);font-size:11px;font-weight:950;letter-spacing:.03em}h1{margin:10px 0 7px;font-size:clamp(26px,7vw,40px);line-height:1.12;letter-spacing:-.04em}h2{margin:0 0 8px;font-size:20px;letter-spacing:-.02em}.lead,.note{margin:0;color:var(--muted);font-size:13px;line-height:1.7}main{padding:8px 0 34px}.stack{display:grid;gap:12px}.card{border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 8px 24px rgba(15,23,42,.05);padding:16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:10px 0 6px;color:#334155;font-size:12px;font-weight:950}input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff;color:var(--ink);font-size:16px;outline:none}input:focus,select:focus{border-color:var(--brand2);box-shadow:0 0 0 4px rgba(20,160,133,.12)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:0;border-radius:14px;padding:11px 14px;background:#e2e8f0;color:#0f172a;font-weight:950;text-decoration:none}.btn.primary{background:var(--brand);color:#fff}.btn.warn{background:var(--warn);color:#fff}.btn.dark{background:var(--dark);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.status{display:inline-flex;align-items:center;min-height:30px;padding:6px 9px;border-radius:999px;background:#e2e8f0;color:#334155;font-size:11px;font-weight:950;white-space:nowrap}.status.ok{background:#dcfce7;color:#166534}.status.warn{background:#fef3c7;color:#92400e}.status.ng{background:#fee2e2;color:#991b1b}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.summaryItem{border:1px solid #dbeafe;border-radius:16px;background:#f8fbff;padding:11px;min-width:0}.summaryItem span{display:block;color:var(--muted);font-size:10px;font-weight:900}.summaryItem b{display:block;margin-top:2px;font-size:26px;line-height:1.1;letter-spacing:-.04em}.sticky{position:sticky;top:0;z-index:20;margin:0 -14px;padding:9px 14px;background:rgba(243,247,251,.92);backdrop-filter:blur(10px)}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}.tab{flex:0 0 auto;min-height:42px;border:1px solid var(--line);border-radius:999px;padding:9px 12px;background:#fff;color:#334155;font-size:12px;font-weight:950}.tab.selected{border-color:var(--brand);background:var(--brand);color:#fff}.list{display:grid;gap:11px}.patientCard{border:1px solid #dbe4ef;border-left:6px solid #94a3b8;border-radius:20px;background:#fff;padding:15px;box-shadow:0 7px 20px rgba(15,23,42,.04)}.patientCard.waiting{border-left-color:var(--warn);background:#fffdf7}.patientCard.treatment{border-left-color:var(--brand);background:#f4fffc}.patientCard.done{border-left-color:var(--ok);background:#f7fff9}.patientTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.timeName{font-size:21px;font-weight:950;line-height:1.35;letter-spacing:-.03em}.meta{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.65}.pill{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:950;white-space:nowrap}.pill.orange{background:#ffedd5;color:#9a3412}.pill.green{background:#dcfce7;color:#166534}.pill.gray{background:#e2e8f0;color:#334155}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{padding:5px 8px;border-radius:999px;background:#f1f5f9;color:#334155;font-size:11px;font-weight:900}.alert{margin-top:10px;padding:10px 11px;border:1px solid #fde68a;border-radius:13px;background:#fffbeb;color:#92400e;font-size:12px;line-height:1.65;font-weight:850}.nextAction{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;margin-top:11px;padding:10px;border:1px solid #dbeafe;border-radius:15px;background:#f8fbff}.nextAction strong{display:block;font-size:13px}.nextAction small{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.5}.empty{border:1px dashed var(--line);border-radius:18px;background:#f8fafc;padding:20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}.footerLinks{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;left:50%;bottom:18px;z-index:100;transform:translateX(-50%);border-radius:999px;background:#0f172a;color:#fff;padding:11px 15px;font-size:13px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}.toast.show{opacity:1;bottom:28px}
    @media(max-width:560px){.grid2{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.patientTop{display:block}.patientTop .pill{margin-top:8px}.nextAction{grid-template-columns:1fr}.nextAction .btn{width:100%}.footerLinks{display:grid;grid-template-columns:1fr}.footerLinks .btn{width:100%}}
  </style>
</head>
<body>
<header><div class="wrap"><section class="hero"><span class="badge">DPRO NEXT｜スタッフ専用</span><h1>本日の担当患者</h1><p class="lead">担当患者、施術待ち、施術中をスマホで確認します。予約追加・店舗設定・回数券・フォローは表示しません。</p></section></div></header>
<main><div class="wrap stack">
  <section class="card">
    <div class="grid2">
      <div><h2>スタッフ選択</h2><label for="staffSelect">使用するスタッフ</label><select id="staffSelect"><option value="">全スタッフ</option></select></div>
      <div><h2>管理コード</h2><label for="adminCodeInput">管理コード</label><input id="adminCodeInput" type="password" placeholder="管理コードを入力" autocomplete="off"><div class="row" style="margin-top:9px;"><button class="btn primary" id="saveAdminBtn" type="button">保存</button><button class="btn ghost" id="toggleAdminBtn" type="button">表示/非表示</button><button class="btn danger" id="clearAdminBtn" type="button">削除</button></div></div>
    </div>
    <div class="row" style="margin-top:12px;"><input id="dateInput" type="date" style="max-width:190px;"><button class="btn primary" id="refreshBtn" type="button">最新状況に更新</button><span class="status" id="apiStatus">待機中</span><span class="status" id="adminStatus">未確認</span></div>
    <div class="summary"><div class="summaryItem"><span>来院待ち</span><b id="countUpcoming">-</b></div><div class="summaryItem"><span>施術待ち</span><b id="countWaiting">-</b></div><div class="summaryItem"><span>施術中</span><b id="countTreatment">-</b></div><div class="summaryItem"><span>完了</span><b id="countCompleted">-</b></div></div>
    <p class="note" id="lastUpdated" style="margin-top:10px;">未更新</p>
  </section>
  <div class="sticky"><div class="tabs" id="staffTabs"><button class="tab selected" data-filter="active" type="button">対応中</button><button class="tab" data-filter="waiting" type="button">施術待ち</button><button class="tab" data-filter="treatment" type="button">施術中</button><button class="tab" data-filter="upcoming" type="button">来院待ち</button><button class="tab" data-filter="completed" type="button">完了</button><button class="tab" data-filter="all" type="button">すべて</button></div></div>
  <section id="reservationList" class="list" aria-live="polite"><div class="empty">管理コードを保存し、スタッフを選択して更新してください。</div></section>
  <section class="card"><h2>画面の役割</h2><p class="note">この画面は施術スタッフ用です。来院受付はiPad、予約追加・回数券・フォロー・店舗設定はオーナーPCで操作します。</p><div class="footerLinks" style="margin-top:12px;"><a class="btn ghost" href="./owner-ipad.html">iPad受付画面</a><a class="btn ghost" href="./owner.html">オーナーPC</a><a class="btn ghost" href="./system-check.html">system-check</a></div></section>
</div></main>
<div class="toast" id="toast">OK</div>
<script>
(() => {
  "use strict";
  const FALLBACK_CONFIG={version:"STEP-SEITAI-NEXT-6-STAFF-FALLBACK",shopCode:"dpro_seitai_demo",shopName:"DPRO整体院",apiBaseUrl:"https://dpro-seitai-line-api.dpromstk2000.workers.dev",adminCodeStorageKey:"DPRO_SEITAI_ADMIN_CODE",adminCodeHeaderName:"X-DPRO-Admin-Code",endpoints:{publicSettings:"/api/public/settings",ownerToday:"/api/owner/today"}};
  const CONFIG=window.DPRO_SEITAI_CONFIG||FALLBACK_CONFIG,$=(id)=>document.getElementById(id),STAFF_KEY=`DPRO_SEITAI_STAFF_SELECTION:${CONFIG.shopCode||"dpro_seitai_demo"}`,actionBusy=new Set();
  const state={date:"",filter:"active",staff:[],selectedStaff:"",reservations:[]};
  function trimSlash(v){return String(v||"").replace(/\/+$/,"")}function endpoint(k){return CONFIG.endpoints?.[k]||FALLBACK_CONFIG.endpoints[k]||k}
  function apiUrl(path,params={}){const url=new URL(`${trimSlash(CONFIG.apiBaseUrl)}${String(path).startsWith("/")?path:`/${path}`}`);url.searchParams.set("shop_code",CONFIG.shopCode||"dpro_seitai_demo");Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&String(v)!=="")url.searchParams.set(k,String(v))});return url.toString()}
  function getAdminCode(){try{return localStorage.getItem(CONFIG.adminCodeStorageKey||"DPRO_SEITAI_ADMIN_CODE")||""}catch{return""}}function saveAdminCode(v){try{localStorage.setItem(CONFIG.adminCodeStorageKey||"DPRO_SEITAI_ADMIN_CODE",String(v||"").trim());return true}catch{return false}}function clearAdminCode(){try{localStorage.removeItem(CONFIG.adminCodeStorageKey||"DPRO_SEITAI_ADMIN_CODE");return true}catch{return false}}
  function adminHeaders(){const code=getAdminCode();return{"Content-Type":"application/json",...(code?{[CONFIG.adminCodeHeaderName||"X-DPRO-Admin-Code"]:code}:{})}}
  async function apiGet(path,params={},admin=true){const response=await fetch(apiUrl(path,params),{method:"GET",headers:admin?adminHeaders():{}}),data=await response.json().catch(()=>({}));if(!response.ok||data.ok===false)throw new Error(data.message||data.error||`API error ${response.status}`);return data}
  async function apiPost(path,body={}){const response=await fetch(apiUrl(path),{method:"POST",headers:adminHeaders(),body:JSON.stringify(body)}),data=await response.json().catch(()=>({}));if(!response.ok||data.ok===false)throw new Error(data.message||data.error||`API error ${response.status}`);return data}
  function todayText(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function formatTime(v){return String(v||"").slice(0,5)}
  function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
  function showToast(text){const el=$("toast");el.textContent=text;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1900)}function setStatus(id,text,kind=""){const el=$(id);if(!el)return;el.textContent=text;el.className=`status ${kind}`.trim()}
  function setBusy(button,busy,label="処理中..."){if(!button)return;if(busy){button.dataset.oldText=button.textContent;button.disabled=true;button.textContent=label}else{button.disabled=false;if(button.dataset.oldText)button.textContent=button.dataset.oldText;delete button.dataset.oldText}}
  function statusLabel(s){return{reserved:"来院待ち",arrived:"施術待ち",in_treatment:"施術中",treatment_done:"完了確認",completed:"完了",cancelled:"キャンセル",no_show:"無断キャンセル"}[s]||s||"-"}function statusPill(s){const c=s==="arrived"||s==="in_treatment"?"orange":s==="completed"||s==="treatment_done"?"green":"gray";return`<span class="pill ${c}">${escapeHtml(statusLabel(s))}</span>`}
  function staffValue(r){return String(r.staff_code||r.id||"")}function staffName(r){return String(r.display_name||r.staff_name||r.name||r.staff_code||"スタッフ")}function selectedStaffRow(){return state.staff.find((r)=>staffValue(r)===state.selectedStaff)||null}
  function reservationMatchesStaff(r){if(!state.selectedStaff)return true;const selected=selectedStaffRow(),keys=[r.staff_code,r.staff_id].filter(Boolean).map(String);if(keys.includes(state.selectedStaff))return true;return selected&&String(r.staff_name||"")===staffName(selected)}
  function reservationMatchesFilter(r){if(state.filter==="all")return true;if(state.filter==="active")return["reserved","arrived","in_treatment","treatment_done"].includes(r.status);if(state.filter==="waiting")return r.status==="arrived";if(state.filter==="treatment")return r.status==="in_treatment"||r.status==="treatment_done";if(state.filter==="upcoming")return r.status==="reserved";if(state.filter==="completed")return r.status==="completed";return true}
  function sortedRows(){return state.reservations.filter(reservationMatchesStaff).filter(reservationMatchesFilter).sort((a,b)=>String(a.start_time||"").localeCompare(String(b.start_time||"")))}
  function updateAdminStatus(){const code=getAdminCode();$("adminCodeInput").value=code;setStatus("adminStatus",code?"管理コード保存済み":"未保存",code?"ok":"warn")}
  function renderStaffOptions(){const current=state.selectedStaff;$("staffSelect").innerHTML=`<option value="">全スタッフ</option>`+state.staff.filter((r)=>r.is_active!==false).map((r)=>`<option value="${escapeHtml(staffValue(r))}">${escapeHtml(staffName(r))}</option>`).join("");$("staffSelect").value=current}
  function renderSummary(){const rows=state.reservations.filter(reservationMatchesStaff);$("countUpcoming").textContent=rows.filter((r)=>r.status==="reserved").length;$("countWaiting").textContent=rows.filter((r)=>r.status==="arrived").length;$("countTreatment").textContent=rows.filter((r)=>r.status==="in_treatment"||r.status==="treatment_done").length;$("countCompleted").textContent=rows.filter((r)=>r.status==="completed").length}
  function actionInfo(r){if(r.status==="arrived")return{action:"start",label:"施術開始",kind:"warn",guide:"患者を案内して施術を始める時に押します。"};if(r.status==="in_treatment"||r.status==="treatment_done")return{action:"complete",label:"施術完了",kind:"dark",guide:"施術が終わった後に押します。"};if(r.status==="reserved")return{action:"",label:"受付待ち",kind:"",guide:"来院受付はiPad受付画面で行います。"};if(r.status==="completed")return{action:"",label:"対応完了",kind:"",guide:"施術完了として記録されています。"};return{action:"",label:"状態確認",kind:"",guide:"受付へ状態を確認してください。"}}
  function renderReservations(){renderSummary();const rows=sortedRows();if(!rows.length){$("reservationList").innerHTML=`<div class="empty">この条件の担当患者はいません。</div>`;return}$("reservationList").innerHTML=rows.map((r)=>{const id=String(r.reservation_id||r.id||""),a=actionInfo(r),cls=r.status==="arrived"?"waiting":r.status==="in_treatment"||r.status==="treatment_done"?"treatment":r.status==="completed"?"done":"",tags=Array.isArray(r.concern_tags)?r.concern_tags:[],primary=a.action?`<button class="btn ${a.kind}" data-staff-action="${a.action}" data-id="${escapeHtml(id)}" type="button">${escapeHtml(a.label)}</button>`:`<span class="status ${r.status==="completed"?"ok":"warn"}">${escapeHtml(a.label)}</span>`;return`<article class="patientCard ${cls}" data-reservation-id="${escapeHtml(id)}"><div class="patientTop"><div><div class="timeName">${escapeHtml(formatTime(r.start_time)||"--:--")}　${escapeHtml(r.customer_name||"-")} 様</div><div class="meta">${escapeHtml(r.menu_name||"-")} / 担当：${escapeHtml(r.staff_name||"未定")}<br>予約日：${escapeHtml(r.reservation_date||state.date)}</div></div>${statusPill(r.status)}</div>${tags.length?`<div class="tags">${tags.map((t)=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>`:""}${r.request_note?`<div class="alert">要望・注意：${escapeHtml(r.request_note)}</div>`:""}<div class="nextAction"><div><strong>次の操作：${escapeHtml(a.label)}</strong><small>${escapeHtml(a.guide)}</small></div>${primary}</div></article>`}).join("");$("reservationList").querySelectorAll("[data-staff-action]").forEach((b)=>b.addEventListener("click",()=>handleAction(b.dataset.staffAction,b.dataset.id,b)))}
  async function handleAction(action,id,button){const row=state.reservations.find((r)=>String(r.reservation_id||r.id)===String(id));if(!row||actionBusy.has(id))return;if(action==="complete"&&!window.confirm(`${row.customer_name||"患者"} 様を施術完了にしますか？`))return;actionBusy.add(id);setBusy(button,true);try{const actor=staffName(selectedStaffRow()||{})||"staff";if(action==="start"){await apiPost("/api/owner/visits/start",{reservation_id:id,actor_name:actor,source:"staff"});showToast("施術中にしました")}else if(action==="complete"){await apiPost("/api/owner/visits/complete",{reservation_id:id,actor_name:actor,source:"staff"});showToast("施術完了にしました")}await loadToday()}catch(error){showToast(error.message)}finally{actionBusy.delete(id);setBusy(button,false)}}
  async function loadSettings(){const data=await apiGet(endpoint("publicSettings"),{},false);state.staff=Array.isArray(data.staff)?data.staff:[];renderStaffOptions()}
  async function loadToday(){if(!getAdminCode())throw new Error("管理コードを保存してください。");state.date=$("dateInput").value||todayText();setStatus("apiStatus","読込中","warn");const data=await apiGet(endpoint("ownerToday"),{date:state.date},true);state.reservations=Array.isArray(data.reservations)?data.reservations:[];renderReservations();setStatus("apiStatus","読込OK","ok");$("lastUpdated").textContent=`最終更新：${new Date().toLocaleString("ja-JP",{hour12:false})}`}
  function bindEvents(){$("saveAdminBtn").addEventListener("click",()=>{const code=$("adminCodeInput").value.trim();if(!code)return showToast("管理コードを入力してください。");saveAdminCode(code);updateAdminStatus();loadToday().catch((e)=>showToast(e.message))});$("toggleAdminBtn").addEventListener("click",()=>{$("adminCodeInput").type=$("adminCodeInput").type==="password"?"text":"password"});$("clearAdminBtn").addEventListener("click",()=>{clearAdminCode();$("adminCodeInput").value="";state.reservations=[];updateAdminStatus();renderReservations();setStatus("apiStatus","管理コード未保存","warn");showToast("管理コードを削除しました")});$("refreshBtn").addEventListener("click",async()=>{const b=$("refreshBtn");setBusy(b,true,"更新中");try{await loadToday()}catch(e){setStatus("apiStatus","エラー","ng");showToast(e.message)}finally{setBusy(b,false)}});$("staffSelect").addEventListener("change",()=>{state.selectedStaff=$("staffSelect").value;try{localStorage.setItem(STAFF_KEY,state.selectedStaff)}catch{}renderReservations()});$("dateInput").addEventListener("change",()=>loadToday().catch((e)=>showToast(e.message)));$("staffTabs").querySelectorAll("[data-filter]").forEach((b)=>b.addEventListener("click",()=>{state.filter=b.dataset.filter;$("staffTabs").querySelectorAll("[data-filter]").forEach((x)=>x.classList.toggle("selected",x===b));renderReservations()}))}
  async function init(){$("dateInput").value=todayText();try{state.selectedStaff=localStorage.getItem(STAFF_KEY)||""}catch{}updateAdminStatus();bindEvents();try{await loadSettings()}catch(e){showToast(e.message)}if(getAdminCode())await loadToday().catch((e)=>{setStatus("apiStatus","エラー","ng");showToast(e.message)})}
  document.addEventListener("DOMContentLoaded",init);
})();
</script>
  <script src="./staff-ready-bridge.js?v=product-ready-central-v12"></script>
</body>
